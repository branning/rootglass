[package]
name = "rootglass-desktop"
version = "0.0.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/branning/rootglass"

[workspace]
members = ["."]
resolver = "2"

[features]
default = ["desktop-ui"]
desktop-ui = ["dep:gpui-kit"]
embedded-terminal = ["desktop-ui", "dep:portable-pty", "dep:rootglass-terminal-vt"]

[[bin]]
name = "rootglass"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.9.0", optional = true }
portable-pty = { version = "0.9", optional = true }
rootglass-app = { path = "../rootglass-app" }
rootglass-cli = { path = "../rootglass-cli" }
rootglass-core = { path = "../rootglass-core" }
rootglass-tui = { path = "../rootglass-tui" }
rootglass-terminal-vt = { path = "../../prototypes/libghostty-vt-ratatui", optional = true }
url = "2.5.8"

[package.metadata.packager]
product-name = "Rootglass"
identifier = "dev.rootglass.app"
description = "Open, verify, and run offline Rootglass guest systems"
homepage = "https://github.com/branning/rootglass"
category = "Utility"
license-file = "../../LICENSE"
binaries = [{ path = "rootglass", main = true }]
out-dir = "target/release"
resources = [
  "../../LICENSE",
  "../../NOTICE.md",
  { src = "runtime-assets", target = "rootglass/runtime-assets" },
]
file-associations = [
  { extensions = ["glass"], mime-type = "application/vnd.rootglass.glass", description = "Rootglass guest package", name = "Rootglass Glass", role = "editor" }
]

[package.metadata.packager.deb]
depends = ["libxcb1", "libxkbcommon0", "libxkbcommon-x11-0"]

[dev-dependencies]
libc = "0.2"
