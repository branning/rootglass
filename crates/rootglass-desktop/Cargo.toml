[package]
name = "rootglass-desktop"
version = "0.0.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/branning/rootglass"

[workspace]
members = ["."]
resolver = "2"

[features]
default = ["desktop-ui"]
tui = ["dep:rootglass-tui", "rootglass-cli/tui"]
desktop-ui = ["dep:gpui-kit", "tui"]
embedded-terminal = ["desktop-ui", "dep:portable-pty", "dep:rootglass-terminal-vt"]

[[bin]]
name = "rootglass"
path = "src/main.rs"

[[test]]
name = "tui_terminal"
path = "tests/tui_terminal.rs"
required-features = ["tui"]

[dependencies]
gpui-kit = { version = "=0.9.0", optional = true }
portable-pty = { version = "0.9", optional = true }
rootglass-app = { path = "../rootglass-app" }
rootglass-cli = { path = "../rootglass-cli", default-features = false }
rootglass-core = { path = "../rootglass-core" }
rootglass-tui = { path = "../rootglass-tui", optional = true }
rootglass-terminal-vt = { path = "../../prototypes/libghostty-vt-ratatui", optional = true }
url = "2.5.8"

[package.metadata.packager]
product-name = "Rootglass"
identifier = "dev.rootglass.app"
description = "Open, verify, and run offline Rootglass guest systems"
homepage = "https://github.com/branning/rootglass"
category = "Utility"
license-file = "../../LICENSE"
binaries = [{ path = "rootglass", main = true }]
out-dir = "target/release"
resources = [
  "../../LICENSE",
  "../../NOTICE.md",
  { src = "runtime-assets", target = "rootglass/runtime-assets" },
  { src = "target/release/THIRD-PARTY-CARGO-LICENSES.html", target = "rootglass/THIRD-PARTY-CARGO-LICENSES.html" },
]
file-associations = [
  { extensions = ["glass"], mime-type = "application/vnd.rootglass.glass", description = "Rootglass guest package", name = "Rootglass Glass", role = "editor" }
]

[package.metadata.packager.deb]
depends = ["libxcb1", "libxkbcommon0", "libxkbcommon-x11-0", "shared-mime-info"]
files = { "../../packaging/linux/rootglass.xml" = "/usr/share/mime/packages/rootglass.xml" }

[dev-dependencies]
libc = "0.2"
