[package]
name = "rootglass-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/branning/rootglass"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
gpui-kit = "=0.9.0"
rootglass-app = { path = "../rootglass-app" }

[package.metadata.packager]
product-name = "Rootglass"
identifier = "dev.rootglass.app"
description = "Open, verify, and run offline Rootglass guest systems"
homepage = "https://github.com/branning/rootglass"
category = "Utility"
license-file = "../../LICENSE"
binaries = [{ path = "rootglass-desktop", main = true }]
out-dir = "target/release"
resources = ["../../LICENSE", "../../NOTICE.md"]
file-associations = [
  { extensions = ["glass"], mime-type = "application/vnd.rootglass.glass", description = "Rootglass guest package", name = "Rootglass Glass", role = "editor" }
]
