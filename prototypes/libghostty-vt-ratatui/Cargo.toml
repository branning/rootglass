[package]
name = "rootglass-terminal-vt"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "libghostty-vt-ratatui-spike"
path = "src/main.rs"

[features]
default = []
gpui = ["dep:gpui-kit"]

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
portable-pty = "0.9"
gpui-kit = { version = "=0.9.0", optional = true }

[build-dependencies]
cc = "1.2"
