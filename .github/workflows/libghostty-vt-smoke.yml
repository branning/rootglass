name: libghostty-vt smoke

on:
  pull_request:
    paths:
      - .github/workflows/libghostty-vt-smoke.yml
      - prototypes/libghostty-vt-ratatui/**
      - scripts/smoke-libghostty-vt-pty.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/libghostty-vt-smoke.yml
      - prototypes/libghostty-vt-ratatui/**
      - scripts/smoke-libghostty-vt-pty.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pty-smoke:
    name: PTY smoke (Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential minisign

      - name: Run signed libghostty-vt PTY smoke
        run: bash scripts/smoke-libghostty-vt-pty.sh
