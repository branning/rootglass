name: libghostty-vt smoke

on:
  pull_request:
    # Avoid rebuilding libghostty-vt and the native PTY smoke on every push.
    types: [opened, reopened, ready_for_review]
    paths:
      - .github/workflows/libghostty-vt-smoke.yml
      - prototypes/libghostty-vt-ratatui/**
      - scripts/smoke-libghostty-vt-pty.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/libghostty-vt-smoke.yml
      - prototypes/libghostty-vt-ratatui/**
      - scripts/smoke-libghostty-vt-pty.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pty-smoke:
    name: PTY smoke (${{ matrix.name }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: macOS arm64
            runner: macos-15
          - name: Windows x86_64
            runner: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential minisign

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install minisign

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install minisign --yes

      - name: Run signed native libghostty-vt PTY smoke
        run: python scripts/smoke-libghostty-vt-pty.py
