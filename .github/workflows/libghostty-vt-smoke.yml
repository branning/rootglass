name: libghostty-vt smoke

on:
  pull_request:
    # Avoid rebuilding libghostty-vt and the native PTY smoke on every push.
    types: [opened, reopened, ready_for_review]
    paths:
      - .github/workflows/libghostty-vt-smoke.yml
      - prototypes/libghostty-vt-ratatui/**
      - crates/rootglass-desktop/**
      - crates/rootglass-tui/**
      - scripts/smoke-gpui-host-xvfb.sh
      - scripts/smoke-rootglass-tui-gpui-xvfb.sh
      - scripts/smoke-rootglass-embedded-guest-xvfb.sh
      - scripts/smoke-libghostty-vt-pty.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/libghostty-vt-smoke.yml
      - prototypes/libghostty-vt-ratatui/**
      - crates/rootglass-desktop/**
      - crates/rootglass-tui/**
      - scripts/smoke-gpui-host-xvfb.sh
      - scripts/smoke-rootglass-tui-gpui-xvfb.sh
      - scripts/smoke-rootglass-embedded-guest-xvfb.sh
      - scripts/smoke-libghostty-vt-pty.py
  workflow_dispatch:
    inputs:
      platform:
        description: Native OS to qualify
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - macos
          - windows
      desktop_smoke:
        description: Run the real-service GPUI desktop smoke on Linux only
        required: false
        type: boolean
        default: false
      capture_library_screenshot:
        description: Capture the empty GPUI library under Xvfb on Linux without booting a guest
        required: false
        type: boolean
        default: false
      capture_publisher_review_screenshot:
        description: Capture the untrusted publisher review under Xvfb on Linux without booting a guest
        required: false
        type: boolean
        default: false
      embedded_guest_smoke:
        description: Run the real guest workflow inside the embedded TUI on Linux only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select_platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select requested platforms
        id: select
        env:
          REQUESTED_PLATFORM: ${{ inputs.platform || 'all' }}
          DESKTOP_SMOKE: ${{ inputs.desktop_smoke || 'false' }}
          CAPTURE_LIBRARY_SCREENSHOT: ${{ inputs.capture_library_screenshot || 'false' }}
          CAPTURE_PUBLISHER_REVIEW_SCREENSHOT: ${{ inputs.capture_publisher_review_screenshot || 'false' }}
          EMBEDDED_GUEST_SMOKE: ${{ inputs.embedded_guest_smoke || 'false' }}
        run: |
          python - <<'PY'
          import json
          import os

          platforms = [
              {"platform": "linux", "name": "Linux x86_64", "runner": "ubuntu-24.04"},
              {"platform": "macos", "name": "macOS arm64", "runner": "macos-15"},
              {"platform": "windows", "name": "Windows x86_64", "runner": "windows-2025"},
          ]
          requested = os.environ["REQUESTED_PLATFORM"]
          desktop_smoke = os.environ["DESKTOP_SMOKE"].lower() == "true"
          capture_library_screenshot = os.environ["CAPTURE_LIBRARY_SCREENSHOT"].lower() == "true"
          capture_publisher_review_screenshot = os.environ["CAPTURE_PUBLISHER_REVIEW_SCREENSHOT"].lower() == "true"
          embedded_guest_smoke = os.environ["EMBEDDED_GUEST_SMOKE"].lower() == "true"
          if sum((desktop_smoke, capture_library_screenshot, capture_publisher_review_screenshot, embedded_guest_smoke)) > 1:
              raise SystemExit("desktop_smoke, screenshot captures, and embedded_guest_smoke are separate runs")
          if embedded_guest_smoke and requested not in ("all", "linux"):
              raise SystemExit("the embedded guest smoke runs on Linux only")
          if (desktop_smoke or capture_library_screenshot or capture_publisher_review_screenshot) and requested not in ("all", "linux"):
              raise SystemExit("the GPUI desktop workflow runs on Linux only")
          selected = platforms if requested == "all" else [
              platform for platform in platforms if platform["platform"] == requested
          ]
          if not selected:
              raise SystemExit(f"unsupported platform selection: {requested}")
          matrix = json.dumps({"include": selected}, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matrix={matrix}", file=output)
          PY

  pty-smoke:
    name: PTY smoke (${{ matrix.name }})
    needs: select_platforms
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.base.ref == 'main')) && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_smoke || inputs.capture_library_screenshot || inputs.capture_publisher_review_screenshot || inputs.embedded_guest_smoke))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_platforms.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check prototype formatting
        run: cargo fmt --manifest-path prototypes/libghostty-vt-ratatui/Cargo.toml --check

      - name: Check desktop formatting
        run: cargo fmt --manifest-path crates/rootglass-desktop/Cargo.toml --check

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          workspaces: |
            prototypes/libghostty-vt-ratatui -> target
            crates/rootglass-desktop -> target

      - name: Cache C compiler outputs (Linux and macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootglass-ccache
          key: ccache-libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('prototypes/libghostty-vt-ratatui/build.rs', 'prototypes/libghostty-vt-ratatui/src/ghostty_shim.c') }}
          restore-keys: |
            ccache-libghostty-vt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache minisign \
            libasound2-dev libfontconfig-dev libssl-dev libvulkan1 \
            libgl1-mesa-dri libwayland-dev libwebkit2gtk-4.1-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev \
            imagemagick mesa-vulkan-drivers vulkan-validationlayers \
            xauth xclip xdotool xvfb
          echo "CC=ccache gcc" >> "$GITHUB_ENV"
          echo "CXX=ccache g++" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ runner.temp }}/rootglass-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=512M" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache minisign
          echo "CC=ccache clang" >> "$GITHUB_ENV"
          echo "CXX=ccache clang++" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ runner.temp }}/rootglass-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=512M" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            & choco install minisign --yes
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { exit 0 }
            if ($attempt -eq 5) { exit $exitCode }
            Write-Host "Retrying minisign download after attempt $attempt of 5."
            Start-Sleep -Seconds 15
          }

      - name: Restore native libghostty-vt build
        id: libghostty-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-ghostty-v1.0.0-zig-0.17.0-${{ hashFiles('scripts/smoke-libghostty-vt-pty.py', 'prototypes/libghostty-vt-ratatui/build.rs', 'prototypes/libghostty-vt-ratatui/src/ghostty_shim.c') }}

      - name: Run signed native libghostty-vt PTY smoke
        id: native-smoke
        env:
          GHOSTTY_VT_PREFIX: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
        run: python scripts/smoke-libghostty-vt-pty.py

      - name: Save native libghostty-vt build
        if: always() && steps.native-smoke.outputs.cache_ready == 'true' && steps.libghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-ghostty-v1.0.0-zig-0.17.0-${{ hashFiles('scripts/smoke-libghostty-vt-pty.py', 'prototypes/libghostty-vt-ratatui/build.rs', 'prototypes/libghostty-vt-ratatui/src/ghostty_shim.c') }}

      - name: Build GPUI libghostty-vt host
        if: runner.os == 'Linux'
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: ${{ runner.temp }}/rootglass-ccache
          CCACHE_MAXSIZE: 512M
          CCACHE_COMPILERCHECK: content
          GHOSTTY_VT_PREFIX: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
        run: cargo build --locked --manifest-path prototypes/libghostty-vt-ratatui/Cargo.toml --features gpui

      - name: Capture GPUI host in Xvfb
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +render -noreset" \
            bash scripts/smoke-gpui-host-xvfb.sh \
            prototypes/libghostty-vt-ratatui/target/debug/libghostty-vt-ratatui-spike \
            prototypes/libghostty-vt-ratatui/artifacts/gpui-xvfb.png

      - name: Build Rootglass desktop with embedded terminal
        if: runner.os == 'Linux'
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: ${{ runner.temp }}/rootglass-ccache
          CCACHE_MAXSIZE: 512M
          CCACHE_COMPILERCHECK: content
          GHOSTTY_VT_PREFIX: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
        run: cargo build --locked --manifest-path crates/rootglass-desktop/Cargo.toml --features embedded-terminal

      - name: Test embedded terminal grid and selection
        if: runner.os == 'Linux'
        env:
          GHOSTTY_VT_PREFIX: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
        run: cargo test --locked --manifest-path crates/rootglass-desktop/Cargo.toml --features embedded-terminal --lib

      - name: Smoke embedded Rootglass TUI in GPUI under Xvfb
        if: runner.os == 'Linux'
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/rootglass-libghostty-vt-prefix/lib
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +render -noreset" \
            bash scripts/smoke-rootglass-tui-gpui-xvfb.sh \
            crates/rootglass-desktop/target/debug/rootglass \
            crates/rootglass-desktop/artifacts/embedded-tui-xvfb.png

      - name: Upload GPUI Xvfb screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gpui-libghostty-vt-xvfb-screenshot
          path: prototypes/libghostty-vt-ratatui/artifacts/gpui-xvfb.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload embedded TUI Xvfb screenshot
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-embedded-tui-xvfb-screenshot
          path: crates/rootglass-desktop/artifacts/embedded-tui-xvfb.png
          if-no-files-found: warn
          retention-days: 14

  desktop-smoke:
    name: GPUI desktop workflow smoke (Linux x86_64)
    if: (github.event_name == 'workflow_dispatch' && (inputs.desktop_smoke || inputs.capture_library_screenshot || inputs.capture_publisher_review_screenshot) && (inputs.platform == 'all' || inputs.platform == 'linux')) || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/rootglass-desktop -> target
          cache-on-failure: "true"

      - name: Install GUI, QEMU, and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cpio dbus-x11 e2fsprogs imagemagick pkg-config \
            libasound2-dev libfontconfig-dev libgl1-mesa-dri libssl-dev \
            libvulkan1 libwayland-dev libwebkit2gtk-4.1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev mesa-vulkan-drivers \
            python3 python3-xlib qemu-system-arm squashfs-tools \
            x11-utils xauth xdg-desktop-portal xdg-desktop-portal-gtk xdotool xvfb

      - name: Build Rootglass desktop and CLI
        run: |
          cargo build --locked --manifest-path crates/rootglass-desktop/Cargo.toml

      - name: Materialize the signed guest fixture assets
        if: github.event_name != 'workflow_dispatch' || (!inputs.capture_library_screenshot && !inputs.capture_publisher_review_screenshot)
        run: bash scripts/materialize-example-assets.sh

      - name: Exercise GPUI desktop workflows under Xvfb
        if: github.event_name != 'workflow_dispatch' || (!inputs.capture_library_screenshot && !inputs.capture_publisher_review_screenshot)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s \
            "-screen 0 1280x800x24 +extension GLX +render -noreset" \
            dbus-run-session -- bash scripts/smoke-rootglass-desktop-xvfb.sh \
            crates/rootglass-desktop/target/debug/rootglass \
            artifacts/gpui-desktop-xvfb

      - name: Capture empty GPUI library under Xvfb
        if: github.event_name == 'workflow_dispatch' && inputs.capture_library_screenshot
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s \
            "-screen 0 1280x800x24 +extension GLX +render -noreset" \
            dbus-run-session -- bash scripts/capture-rootglass-library-xvfb.sh \
            crates/rootglass-desktop/target/debug/rootglass \
            artifacts/gpui-desktop-xvfb

      - name: Capture untrusted publisher review under Xvfb
        if: github.event_name == 'workflow_dispatch' && inputs.capture_publisher_review_screenshot
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s \
            "-screen 0 1280x800x24 +extension GLX +render -noreset" \
            dbus-run-session -- bash scripts/capture-rootglass-publisher-review-xvfb.sh \
            crates/rootglass-desktop/target/debug/rootglass \
            artifacts/gpui-desktop-xvfb

      - name: Upload GPUI desktop smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-desktop-workflow-smoke-linux-x86_64
          path: artifacts/gpui-desktop-xvfb/
          if-no-files-found: warn
          retention-days: 14

  embedded-guest-smoke:
    name: Embedded TUI guest workflow smoke (Linux x86_64)
    needs: [select_platforms, pty-smoke]
    if: always() && needs.select_platforms.result == 'success' && (needs.pty-smoke.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.embedded_guest_smoke)) && ((github.event_name == 'workflow_dispatch' && inputs.embedded_guest_smoke && (inputs.platform == 'all' || inputs.platform == 'linux')) || (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review') && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust and Python
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            prototypes/libghostty-vt-ratatui -> target
            crates/rootglass-desktop -> target
          cache-on-failure: 'true'

      - name: Cache C compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootglass-ccache
          key: ccache-libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('prototypes/libghostty-vt-ratatui/build.rs', 'prototypes/libghostty-vt-ratatui/src/ghostty_shim.c') }}
          restore-keys: |
            ccache-libghostty-vt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install GUI, QEMU, and fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache cpio dbus-x11 e2fsprogs imagemagick minisign pkg-config \
            libasound2-dev libfontconfig-dev libgl1-mesa-dri libssl-dev \
            libvulkan1 libwayland-dev libwebkit2gtk-4.1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev mesa-vulkan-drivers \
            python3 qemu-system-arm squashfs-tools \
            x11-utils xauth xdg-desktop-portal xdg-desktop-portal-gtk xdotool xvfb
          echo "CC=ccache gcc" >> "$GITHUB_ENV"
          echo "CXX=ccache g++" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=${{ runner.temp }}/rootglass-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=512M" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Restore native libghostty-vt build
        id: libghostty-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-ghostty-v1.0.0-zig-0.17.0-${{ hashFiles('scripts/smoke-libghostty-vt-pty.py', 'prototypes/libghostty-vt-ratatui/build.rs', 'prototypes/libghostty-vt-ratatui/src/ghostty_shim.c') }}

      - name: Build and smoke pinned libghostty-vt
        id: native-smoke
        env:
          GHOSTTY_VT_PREFIX: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
        run: python scripts/smoke-libghostty-vt-pty.py

      - name: Save native libghostty-vt build
        if: always() && steps.native-smoke.outputs.cache_ready == 'true' && steps.libghostty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-ghostty-v1.0.0-zig-0.17.0-${{ hashFiles('scripts/smoke-libghostty-vt-pty.py', 'prototypes/libghostty-vt-ratatui/build.rs', 'prototypes/libghostty-vt-ratatui/src/ghostty_shim.c') }}

      - name: Materialize the signed guest fixture assets
        run: bash scripts/materialize-example-assets.sh

      - name: Build Rootglass with the embedded terminal feature
        env:
          GHOSTTY_VT_PREFIX: ${{ runner.temp }}/rootglass-libghostty-vt-prefix
        run: cargo build --locked --manifest-path crates/rootglass-desktop/Cargo.toml --features embedded-terminal

      - name: Exercise a guest boot through the embedded TUI under Xvfb
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/rootglass-libghostty-vt-prefix/lib
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +render -noreset" \
            dbus-run-session -- bash scripts/smoke-rootglass-embedded-guest-xvfb.sh \
            crates/rootglass-desktop/target/debug/rootglass \
            crates/rootglass-desktop/artifacts/embedded-guest-xvfb

      - name: Upload embedded guest workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-tui-guest-workflow-smoke-linux-x86_64
          path: crates/rootglass-desktop/artifacts/embedded-guest-xvfb/
          if-no-files-found: warn
          retention-days: 14
