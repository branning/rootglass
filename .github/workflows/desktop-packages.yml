name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - linux-arm64
          - macos
          - windows
          - windows-arm64
      artifact_run_id:
        description: Successful package workflow run ID to attach to a release without rebuilding
        type: string
        required: false
        default: ""
      release_tag:
        description: Existing mutable draft prerelease to receive all-platform assets before publication
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}-${{ inputs.artifact_run_id || 'build' }}-${{ inputs.release_tag || 'no-release' }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate mutable draft prerelease
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag }}
    runs-on: ubuntu-latest
    # GitHub hides draft releases from tokens with contents:read.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release target
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ]]; then
            echo "Build against the same tag named by release_tag" >&2
            exit 1
          fi
          release_record=$(bash scripts/find-release-by-tag.sh "$RELEASE_TAG")
          IFS=$'\t' read -r release_id release_draft release_immutable release_prerelease <<< "$release_record"
          [[ "$release_draft" == true ]] || { echo "Release $RELEASE_TAG must be a draft" >&2; exit 1; }
          [[ "$release_immutable" == false ]] || { echo "Release $RELEASE_TAG is immutable" >&2; exit 1; }
          [[ "$release_prerelease" == true ]] || { echo "Release $RELEASE_TAG must be a prerelease" >&2; exit 1; }
          echo "Validated mutable draft prerelease $RELEASE_TAG (release ID $release_id)"

  select_platforms:
    name: Select package platforms
    needs: [validate-release]
    if: always() && (needs.validate-release.result == 'success' || needs.validate-release.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      build_packages: ${{ steps.select.outputs.build_packages }}
    steps:
      - name: Validate release build selection
        env:
          PLATFORM: ${{ inputs.platform }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          case "$PLATFORM" in
            all|linux|linux-arm64|macos|windows|windows-arm64) ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          if [[ -n "$RELEASE_TAG" && "$PLATFORM" != all ]]; then
            echo "Release attachment requires platform=all" >&2
            exit 1
          fi
          if [[ -n "$ARTIFACT_RUN_ID" && -z "$RELEASE_TAG" ]]; then
            echo "release_tag is required with artifact_run_id" >&2
            exit 1
          fi
          if [[ -n "$ARTIFACT_RUN_ID" && ! "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "artifact_run_id must be numeric" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && ( "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ) ]]; then
            echo "Build against the same tag named by release_tag" >&2
            exit 1
          fi

      - name: Select platform matrix
        id: select
        env:
          PLATFORM: ${{ inputs.platform }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          matrix=$(jq -cn --arg platform "$PLATFORM" '
            {include: ([
              {config: "linux", runtime: "linux-x86_64", name: "Linux x64", runner: "ubuntu-24.04", format: "deb", extension: "deb"},
              {config: "linux-arm64", runtime: "linux-aarch64", name: "Linux arm64", runner: "ubuntu-24.04-arm", format: "deb", extension: "deb"},
              {config: "macos", name: "macOS arm64", runner: "macos-15", format: "dmg", extension: "dmg"},
              {config: "windows", runtime: "windows-x86_64", name: "Windows x64", runner: "windows-2025", format: "nsis", extension: "exe"},
              {config: "windows-arm64", runtime: "windows-aarch64", name: "Windows ARM64", runner: "windows-11-arm", format: "nsis", extension: "exe"}
            ] | map(select(.config == $platform or $platform == "all")))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            echo "build_packages=false" >> "$GITHUB_OUTPUT"
            echo "mode=attach existing artifacts from run $ARTIFACT_RUN_ID"
          else
            echo "build_packages=true" >> "$GITHUB_OUTPUT"
            echo "mode=build selected package platforms"
          fi

  runtime_assets:
    name: Materialize pinned guest boot assets
    needs: [select_platforms]
    if: ${{ always() && needs.select_platforms.result == 'success' && fromJSON(needs.select_platforms.outputs.build_packages) }}
    runs-on: ubuntu-24.04
    outputs:
      runtime_version: ${{ steps.version.outputs.runtime_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve runtime version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/rootglass-desktop/Cargo.toml", "rb"))["package"]["version"])')
          tag="$RELEASE_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" && "${tag#v}" != "$version" ]]; then
            echo "Release tag $tag does not match desktop version $version" >&2
            exit 1
          fi
          echo "runtime_version=$version" >> "$GITHUB_OUTPUT"

      - name: Install guest asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio e2fsprogs squashfs-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies for sample bundle verification
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/rootglass-desktop -> target

      - name: Install Cargo About for dependency license inventory
        run: cargo install cargo-about --locked --version 0.9.3

      - name: Generate the desktop dependency license report
        run: |
          mkdir -p "$RUNNER_TEMP/rootglass-cargo-licenses"
          cargo about generate --manifest-path crates/rootglass-desktop/Cargo.toml \
            --locked --fail docs/third-party-licenses.hbs \
            --output-file "$RUNNER_TEMP/rootglass-cargo-licenses/THIRD-PARTY-CARGO-LICENSES.html"

      - name: Upload desktop dependency license report
        uses: actions/upload-artifact@v4
        with:
          name: third-party-cargo-licenses
          path: ${{ runner.temp }}/rootglass-cargo-licenses/THIRD-PARTY-CARGO-LICENSES.html
          if-no-files-found: error
          retention-days: 14

      - name: Materialize Alpine guest assets
        env:
          ROOTFS_SIZE_MB: "128"
          STATE_SIZE_MB: "32"
        run: bash scripts/materialize-example-assets.sh

      - name: Package and verify the signed example glass
        run: bash scripts/package-release-example.sh "$RUNNER_TEMP/rootglass-example"

      - name: Upload offline guest boot assets
        uses: actions/upload-artifact@v4
        with:
          name: guest-runtime-assets
          path: |
            runtime-assets/alpine-aarch64/vmlinuz-virt
            runtime-assets/alpine-aarch64/initramfs-virt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload materialized example glass
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-example-glass
          path: |
            ${{ runner.temp }}/rootglass-example/rootglass-hello-world-0.1.0.glass
            ${{ runner.temp }}/rootglass-example/SHA256SUMS-example.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package:
    name: ${{ matrix.name }} package
    if: ${{ always() && needs.select_platforms.result == 'success' && needs.runtime_assets.result == 'success' && fromJSON(needs.select_platforms.outputs.build_packages) }}
    needs: [select_platforms, runtime_assets]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_platforms.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download guest boot assets
        uses: actions/download-artifact@v4
        with:
          name: guest-runtime-assets
          path: ${{ runner.temp }}/rootglass-guest-assets

      - name: Download desktop dependency license report
        uses: actions/download-artifact@v4
        with:
          name: third-party-cargo-licenses
          path: ${{ runner.temp }}/rootglass-cargo-licenses

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rootglass-desktop -> target

      - name: Cache C/C++ compiler outputs (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootglass-ccache
          key: ccache-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/rootglass-desktop/Cargo.lock') }}
          restore-keys: |
            ccache-packages-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache clang g++ gcc dpkg-dev \
            libasound2-dev libfontconfig-dev libssl-dev libvulkan1 \
            libwayland-dev libwebkit2gtk-4.1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev vulkan-validationlayers \
            ipxe-qemu qemu-system-arm pax-utils

      - name: Install QEMU on macOS
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Install QEMU on Windows x64
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: choco install qemu --yes --no-progress

      - name: Install native QEMU on Windows ARM64
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          cache: true
          install: mingw-w64-clang-aarch64-qemu mingw-w64-clang-aarch64-ntldd

      - name: Prepare bundled Linux QEMU runtime
        if: runner.os == 'Linux'
        env:
          RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        run: bash scripts/prepare-qemu-runtime.sh "$RUNTIME_VERSION" "${{ matrix.runtime }}" "$RUNNER_TEMP/rootglass-guest-assets"

      - name: Prepare bundled macOS QEMU runtime
        if: runner.os == 'macOS'
        env:
          RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        run: bash scripts/prepare-qemu-runtime.sh "$RUNTIME_VERSION" macos-arm64 "$RUNNER_TEMP/rootglass-guest-assets"

      - name: Prepare bundled Windows QEMU runtime
        if: runner.os == 'Windows'
        env:
          RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
          TARGET_PLATFORM: ${{ matrix.runtime }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: .\scripts\prepare-qemu-runtime.ps1 -RuntimeVersion $env:RUNTIME_VERSION -TargetPlatform $env:TARGET_PLATFORM -Msys2Root $env:MSYS2_ROOT -GuestAssetDir "$env:RUNNER_TEMP/rootglass-guest-assets"

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Install Cargo Packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Stage desktop dependency licenses (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p crates/rootglass-desktop/target/release
          cp "$RUNNER_TEMP/rootglass-cargo-licenses/THIRD-PARTY-CARGO-LICENSES.html" \
            crates/rootglass-desktop/target/release/

      - name: Stage desktop dependency licenses (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/rootglass-desktop/target/release | Out-Null
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/rootglass-cargo-licenses/THIRD-PARTY-CARGO-LICENSES.html" `
            -Destination crates/rootglass-desktop/target/release/

      - name: Build and package desktop (Linux ccache)
        if: runner.os == 'Linux'
        working-directory: crates/rootglass-desktop
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: ${{ runner.temp }}/rootglass-ccache
          CCACHE_MAXSIZE: 512M
          CCACHE_COMPILERCHECK: content
          ROOTGLASS_RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        run: |
          cargo build --locked --release
          cargo-packager --release --formats ${{ matrix.format }}

      - name: Build and package desktop
        if: runner.os != 'Linux'
        working-directory: crates/rootglass-desktop
        env:
          ROOTGLASS_RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        run: |
          cargo build --locked --release
          cargo-packager --release --formats ${{ matrix.format }}

      - name: Write package checksum
        if: runner.os == 'Linux'
        working-directory: crates/rootglass-desktop
        run: sha256sum target/release/*.${{ matrix.extension }} "$RUNNER_TEMP"/rootglass-runtime-${{ matrix.runtime }}-${{ needs.runtime_assets.outputs.runtime_version }}.tar.gz > target/release/SHA256SUMS-${{ matrix.config }}.txt

      - name: Write package checksum
        if: runner.os == 'macOS'
        working-directory: crates/rootglass-desktop
        run: shasum -a 256 target/release/*.${{ matrix.extension }} "$RUNNER_TEMP"/rootglass-runtime-macos-arm64-${{ needs.runtime_assets.outputs.runtime_version }}.tar.gz > target/release/SHA256SUMS-${{ matrix.config }}.txt

      - name: Write package checksum
        if: runner.os == 'Windows'
        working-directory: crates/rootglass-desktop
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem target/release/*-setup.${{ matrix.extension }})
          if ($installer.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installer.Count)"
          }
          $installer +
          @(Get-Item "$env:RUNNER_TEMP/rootglass-runtime-${{ matrix.runtime }}-${{ needs.runtime_assets.outputs.runtime_version }}.zip") |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content target/release/SHA256SUMS-${{ matrix.config }}.txt

      - name: Upload unsigned package artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-${{ matrix.format }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            crates/rootglass-desktop/target/release/*.${{ matrix.extension }}
            crates/rootglass-desktop/target/release/SHA256SUMS-${{ matrix.config }}.txt
            ${{ runner.temp }}/rootglass-runtime-*.tar.gz
            ${{ runner.temp }}/rootglass-runtime-*.zip
            ${{ runner.temp }}/rootglass-runtime-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows installer instead of raw desktop executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-${{ matrix.format }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            crates/rootglass-desktop/target/release/*-setup.${{ matrix.extension }}
            crates/rootglass-desktop/target/release/SHA256SUMS-${{ matrix.config }}.txt
            ${{ runner.temp }}/rootglass-runtime-*.zip
            ${{ runner.temp }}/rootglass-runtime-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  validate-existing-package-run:
    name: Validate selected package run for release
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.release_tag && inputs.artifact_run_id && needs.validate-release.result == 'success' && needs.select_platforms.result == 'success' }}
    needs: [validate-release, select_platforms]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Verify source run belongs to the release tag
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "artifact_run_id must be numeric" >&2; exit 1; }
          [[ -n "$RELEASE_TAG" ]] || { echo "release_tag is required with artifact_run_id" >&2; exit 1; }
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")
          [[ "$(jq -r '.path' <<< "$run_json")" == ".github/workflows/desktop-packages.yml" ]] || {
            echo "Run $ARTIFACT_RUN_ID is not the Desktop packages workflow" >&2
            exit 1
          }
          [[ "$(jq -r '.status' <<< "$run_json")" == "completed" && \
             "$(jq -r '.conclusion' <<< "$run_json")" == "success" ]] || {
            echo "Artifact run $ARTIFACT_RUN_ID must have completed successfully" >&2
            exit 1
          }
          run_head_sha=$(jq -r '.head_sha' <<< "$run_json")
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          while [[ "$tag_type" == "tag" ]]; do
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
            tag_type=$(jq -r '.object.type' <<< "$tag_object")
            tag_sha=$(jq -r '.object.sha' <<< "$tag_object")
          done
          [[ "$run_head_sha" == "$tag_sha" ]] || {
            echo "Artifact run $ARTIFACT_RUN_ID was not built from release tag $RELEASE_TAG" >&2
            exit 1
          }
          source_jobs_text=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name == "Materialize pinned guest boot assets" or .name == "Linux x64 package" or .name == "Linux arm64 package" or .name == "macOS arm64 package" or .name == "Windows x64 package" or .name == "Windows ARM64 package") | [.name, .conclusion] | @tsv')
          mapfile -t source_jobs <<< "$source_jobs_text"
          if [[ "${#source_jobs[@]}" -ne 6 ]]; then
            printf 'Expected six completed runtime/package jobs in run %s, found %s\n' "$ARTIFACT_RUN_ID" "${#source_jobs[@]}" >&2
            printf '%s\n' "${source_jobs[@]}" >&2
            exit 1
          fi
          for required_job in \
            'Materialize pinned guest boot assets' \
            'Linux x64 package' \
            'Linux arm64 package' \
            'macOS arm64 package' \
            'Windows x64 package' \
            'Windows ARM64 package'; do
            if ! printf '%s\n' "${source_jobs[@]}" | grep -Fqx "$required_job"$'\t'success; then
              echo "Required package job did not succeed in run $ARTIFACT_RUN_ID: $required_job" >&2
              printf '%s\n' "${source_jobs[@]}" >&2
              exit 1
            fi
          done
          echo "source_sha=$run_head_sha" >> "$GITHUB_OUTPUT"

  release-source:
    name: Select verified release package source
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.release_tag && needs.validate-release.result == 'success' && needs.select_platforms.result == 'success' && ((fromJSON(needs.select_platforms.outputs.build_packages) && needs.package.result == 'success' && needs.runtime_assets.result == 'success') || (!fromJSON(needs.select_platforms.outputs.build_packages) && needs.validate-existing-package-run.result == 'success')) }}
    needs: [validate-release, select_platforms, package, runtime_assets, validate-existing-package-run]
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.source.outputs.run_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Record verified source run
        id: source
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          VALIDATED_SOURCE_SHA: ${{ needs.validate-existing-package-run.outputs.source_sha }}
        run: |
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            echo "run_id=$ARTIFACT_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "source_sha=$VALIDATED_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  sign-macos-release:
    name: Sign and notarize macOS release app
    needs: [release-source]
    if: ${{ always() && needs.release-source.result == 'success' }}
    runs-on: macos-15
    environment: rootglass-macos-signing
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout signing workflow sources
        uses: actions/checkout@v6

      - name: Download unsigned macOS package
        uses: actions/download-artifact@v4
        with:
          name: rootglass-dmg-macOS-ARM64
          path: ${{ runner.temp }}/rootglass-macos-package
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Sign, notarize, staple, and verify the app and disk image
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          INPUT_DMG: ${{ runner.temp }}/rootglass-macos-package
          OUTPUT_DIR: ${{ runner.temp }}/rootglass-signed-macos
        run: |
          set -euo pipefail
          mapfile -t dmgs < <(find "$INPUT_DMG" -type f -name '*.dmg' -print)
          [[ "${#dmgs[@]}" -eq 1 ]] || { echo "Expected one macOS DMG" >&2; exit 1; }
          bash scripts/sign-macos-release-dmg.sh "${dmgs[0]}" "$OUTPUT_DIR" "$GITHUB_WORKSPACE"

      - name: Upload signed macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-release-macos-arm64
          path: ${{ runner.temp }}/rootglass-signed-macos/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  sign-windows-release:
    name: Sign Windows ${{ matrix.arch }} installer
    needs: [release-source]
    if: ${{ always() && needs.release-source.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    environment: rootglass-windows-signing
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            package_artifact: rootglass-nsis-Windows-X64
          - arch: arm64
            runner: windows-11-arm
            package_artifact: rootglass-nsis-Windows-ARM64
    steps:
      - name: Checkout signing workflow sources
        uses: actions/checkout@v6

      - name: Download unsigned Windows installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package_artifact }}
          path: ${{ runner.temp }}/rootglass-windows-package
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Authenticode-sign and verify the installer
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          ARCHITECTURE: ${{ matrix.arch }}
          OUTPUT_DIR: ${{ runner.temp }}/rootglass-signed-windows
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "$env:RUNNER_TEMP/rootglass-windows-package/*-setup.exe")
          if ($installer.Count -ne 1) { throw "Expected exactly one Windows installer" }
          .\scripts\sign-windows-release-installer.ps1 `
            -InputInstaller $installer[0].FullName `
            -OutputDirectory $env:OUTPUT_DIR `
            -Architecture $env:ARCHITECTURE

      - name: Upload signed Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-release-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/rootglass-signed-windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attach-release-assets:
    name: Assemble, attest, and verify release assets
    needs: [release-source, sign-macos-release, sign-windows-release]
    if: ${{ always() && needs.release-source.result == 'success' && needs.sign-macos-release.result == 'success' && needs.sign-windows-release.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout the release inventory and scripts
        uses: actions/checkout@v6

      - name: Download package and signing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.release-source.outputs.run_id }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'rootglass-*' --dir "$RUNNER_TEMP/release-artifacts"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'rootglass-release-*' --dir "$RUNNER_TEMP/release-signatures"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name third-party-cargo-licenses --dir "$RUNNER_TEMP/rootglass-cargo-licenses"

      - name: Verify and assemble signed product assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          bash scripts/assemble-release-artifacts.sh \
            "$RUNNER_TEMP/release-artifacts" \
            "$RUNNER_TEMP/release-assets-ready" \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-signatures"

      - name: Include project notices and exact runtime license texts
        run: |
          set -euo pipefail
          cp LICENSE "$RUNNER_TEMP/release-assets-ready/LICENSE"
          cp NOTICE.md "$RUNNER_TEMP/release-assets-ready/THIRD-PARTY-NOTICES.md"
          cp "$RUNNER_TEMP/rootglass-cargo-licenses/THIRD-PARTY-CARGO-LICENSES.html" \
            "$RUNNER_TEMP/release-assets-ready/THIRD-PARTY-CARGO-LICENSES.html"
          python3 scripts/collect-runtime-licenses.py \
            "$RUNNER_TEMP/release-assets-ready" \
            "$RUNNER_TEMP/release-assets-ready/THIRD-PARTY-RUNTIME-LICENSES.tar.gz"

      - name: Generate SPDX SBOM from locked Rust source dependencies
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ${{ github.workspace }}
          format: spdx-json
          output-file: ${{ runner.temp }}/release-assets-ready/rootglass-source-sbom.spdx.json
          syft-version: v1.57.1
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SPDX SBOM from release packages and runtime archives
        uses: anchore/sbom-action@v0.24.3
        with:
          path: ${{ runner.temp }}/release-assets-ready
          format: spdx-json
          output-file: ${{ runner.temp }}/release-assets-ready/rootglass-release-sbom.spdx.json
          syft-version: v1.57.1
          upload-artifact: false
          upload-release-assets: false

      - name: Record exact release, runtime, signing, and qualification inventory
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.release-source.outputs.source_sha }}
          PACKAGE_RUN_ID: ${{ needs.release-source.outputs.run_id }}
          SIGNING_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/write-release-provenance.py \
            "$RUNNER_TEMP/release-assets-ready" \
            "$RELEASE_TAG" "$SOURCE_COMMIT" "$PACKAGE_RUN_ID" \
            "$SIGNING_RUN_ID" "$GITHUB_REPOSITORY"

      - name: Create and verify release checksum manifest
        env:
          READY_ROOT: ${{ runner.temp }}/release-assets-ready
        run: |
          set -euo pipefail
          cd "$READY_ROOT"
          mapfile -t assets < <(find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS-release.txt' \
            ! -name 'SHA256SUMS-release.sigstore.json' -printf '%f\n' | sort)
          [[ "${#assets[@]}" -gt 30 ]] || { echo "Release inventory is incomplete" >&2; exit 1; }
          sha256sum "${assets[@]}" > SHA256SUMS-release.txt
          sha256sum --check SHA256SUMS-release.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v3.1.4

      - name: Sign release checksums with GitHub Actions OIDC
        env:
          READY_ROOT: ${{ runner.temp }}/release-assets-ready
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "$READY_ROOT/SHA256SUMS-release.sigstore.json" \
            "$READY_ROOT/SHA256SUMS-release.txt"
          cosign verify-blob \
            --bundle "$READY_ROOT/SHA256SUMS-release.sigstore.json" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/desktop-packages.yml@refs/tags/$RELEASE_TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$READY_ROOT/SHA256SUMS-release.txt"

      - name: Attach assets to the validated draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          READY_ROOT: ${{ runner.temp }}/release-assets-ready
        run: |
          set -euo pipefail
          mapfile -t assets < <(find "$READY_ROOT" -maxdepth 1 -type f -print | sort)
          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Download the attached release and verify its signed checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/desktop-packages.yml@refs/tags/${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/release-downloaded"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*' --dir "$downloaded"
          cosign verify-blob \
            --bundle "$downloaded/SHA256SUMS-release.sigstore.json" \
            --certificate-identity "$RELEASE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$downloaded/SHA256SUMS-release.txt"
          (cd "$downloaded" && sha256sum --check SHA256SUMS-release.txt)
          expected_files="$RUNNER_TEMP/release-expected-files.txt"
          actual_files="$RUNNER_TEMP/release-actual-files.txt"
          {
            awk '{ print $2 }' "$downloaded/SHA256SUMS-release.txt"
            printf '%s\n' SHA256SUMS-release.txt SHA256SUMS-release.sigstore.json
          } | sort -u > "$expected_files"
          find "$downloaded" -maxdepth 1 -type f -printf '%f\n' | sort -u > "$actual_files"
          diff -u "$expected_files" "$actual_files"
