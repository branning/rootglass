name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - macos
          - windows
      artifact_run_id:
        description: Successful package workflow run ID to attach to a release without rebuilding
        type: string
        required: false
        default: ""
      release_tag:
        description: Existing mutable draft prerelease to receive all-platform assets before publication
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}-${{ inputs.artifact_run_id || 'build' }}-${{ inputs.release_tag || 'no-release' }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate mutable draft prerelease
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag }}
    runs-on: ubuntu-latest
    # GitHub hides draft releases from tokens with contents:read.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release target
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$ARTIFACT_RUN_ID" && ( "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ) ]]; then
            echo "Build against the same tag named by release_tag" >&2
            exit 1
          fi
          release_record=$(bash scripts/find-release-by-tag.sh "$RELEASE_TAG")
          IFS=$'\t' read -r release_id release_draft release_immutable release_prerelease <<< "$release_record"
          [[ "$release_draft" == true ]] || { echo "Release $RELEASE_TAG must be a draft" >&2; exit 1; }
          [[ "$release_immutable" == false ]] || { echo "Release $RELEASE_TAG is immutable" >&2; exit 1; }
          [[ "$release_prerelease" == true ]] || { echo "Release $RELEASE_TAG must be a prerelease" >&2; exit 1; }
          echo "Validated mutable draft prerelease $RELEASE_TAG (release ID $release_id)"

  select_platforms:
    name: Select package platforms
    needs: [validate-release]
    if: always() && (needs.validate-release.result == 'success' || needs.validate-release.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      build_packages: ${{ steps.select.outputs.build_packages }}
    steps:
      - name: Validate release build selection
        env:
          PLATFORM: ${{ inputs.platform }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          case "$PLATFORM" in
            all|linux|macos|windows) ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          if [[ -n "$RELEASE_TAG" && "$PLATFORM" != all ]]; then
            echo "Release attachment requires platform=all" >&2
            exit 1
          fi
          if [[ -n "$ARTIFACT_RUN_ID" && -z "$RELEASE_TAG" ]]; then
            echo "release_tag is required with artifact_run_id" >&2
            exit 1
          fi
          if [[ -n "$ARTIFACT_RUN_ID" && ! "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "artifact_run_id must be numeric" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && -z "$ARTIFACT_RUN_ID" && ( "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$RELEASE_TAG" ) ]]; then
            echo "Build against the same tag named by release_tag" >&2
            exit 1
          fi

      - name: Select platform matrix
        id: select
        env:
          PLATFORM: ${{ inputs.platform }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          matrix=$(jq -cn --arg platform "$PLATFORM" '
            {include: ([
              {config: "linux", name: "Linux x64", runner: "ubuntu-24.04", format: "deb", extension: "deb"},
              {config: "macos", name: "macOS arm64", runner: "macos-15", format: "dmg", extension: "dmg"},
              {config: "windows", name: "Windows x64", runner: "windows-2025", format: "nsis", extension: "exe"}
            ] | map(select($platform == "all" or .config == $platform)))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            echo "build_packages=false" >> "$GITHUB_OUTPUT"
            echo "mode=attach existing artifacts from run $ARTIFACT_RUN_ID"
          else
            echo "build_packages=true" >> "$GITHUB_OUTPUT"
            echo "mode=build selected package platforms"
          fi

  runtime_assets:
    name: Materialize pinned guest boot assets
    needs: [select_platforms]
    if: ${{ fromJSON(needs.select_platforms.outputs.build_packages) }}
    runs-on: ubuntu-24.04
    outputs:
      runtime_version: ${{ steps.version.outputs.runtime_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve runtime version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/rootglass-desktop/Cargo.toml", "rb"))["package"]["version"])')
          tag="$RELEASE_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$tag" && "${tag#v}" != "$version" ]]; then
            echo "Release tag $tag does not match desktop version $version" >&2
            exit 1
          fi
          echo "runtime_version=$version" >> "$GITHUB_OUTPUT"

      - name: Install guest asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio e2fsprogs squashfs-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies for sample bundle verification
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/rootglass-desktop -> target

      - name: Materialize Alpine guest assets
        env:
          ROOTFS_SIZE_MB: "128"
          STATE_SIZE_MB: "32"
        run: bash scripts/materialize-example-assets.sh

      - name: Package and verify the signed example glass
        run: bash scripts/package-release-example.sh "$RUNNER_TEMP/rootglass-example"

      - name: Upload offline guest boot assets
        uses: actions/upload-artifact@v4
        with:
          name: guest-runtime-assets
          path: |
            runtime-assets/alpine-aarch64/vmlinuz-virt
            runtime-assets/alpine-aarch64/initramfs-virt
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload materialized example glass
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-example-glass
          path: |
            ${{ runner.temp }}/rootglass-example/rootglass-hello-world-0.1.0.glass
            ${{ runner.temp }}/rootglass-example/SHA256SUMS-example.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  package:
    name: ${{ matrix.name }} package
    if: ${{ fromJSON(needs.select_platforms.outputs.build_packages) }}
    needs: [select_platforms, runtime_assets]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select_platforms.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download guest boot assets
        uses: actions/download-artifact@v4
        with:
          name: guest-runtime-assets
          path: ${{ runner.temp }}/rootglass-guest-assets

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rootglass-desktop -> target

      - name: Cache C/C++ compiler outputs (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootglass-ccache
          key: ccache-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/rootglass-desktop/Cargo.lock') }}
          restore-keys: |
            ccache-packages-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache clang g++ gcc dpkg-dev \
            libasound2-dev libfontconfig-dev libssl-dev libvulkan1 \
            libwayland-dev libwebkit2gtk-4.1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev vulkan-validationlayers \
            qemu-system-arm pax-utils

      - name: Install QEMU on macOS
        if: runner.os == 'macOS'
        run: brew install qemu

      - name: Install QEMU on Windows
        if: runner.os == 'Windows'
        run: choco install qemu --yes --no-progress

      - name: Prepare bundled Linux QEMU runtime
        if: runner.os == 'Linux'
        env:
          RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        run: bash scripts/prepare-qemu-runtime.sh "$RUNTIME_VERSION" linux-x86_64 "$RUNNER_TEMP/rootglass-guest-assets"

      - name: Prepare bundled macOS QEMU runtime
        if: runner.os == 'macOS'
        env:
          RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        run: bash scripts/prepare-qemu-runtime.sh "$RUNTIME_VERSION" macos-arm64 "$RUNNER_TEMP/rootglass-guest-assets"

      - name: Prepare bundled Windows QEMU runtime
        if: runner.os == 'Windows'
        env:
          RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        shell: pwsh
        run: .\scripts\prepare-qemu-runtime.ps1 -RuntimeVersion $env:RUNTIME_VERSION -GuestAssetDir "$env:RUNNER_TEMP/rootglass-guest-assets"

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Install Cargo Packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build and package desktop (Linux ccache)
        if: runner.os == 'Linux'
        working-directory: crates/rootglass-desktop
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: ${{ runner.temp }}/rootglass-ccache
          CCACHE_MAXSIZE: 512M
          CCACHE_COMPILERCHECK: content
          ROOTGLASS_RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        run: |
          cargo build --locked --release
          cargo-packager --release --formats ${{ matrix.format }}

      - name: Build and package desktop
        if: runner.os != 'Linux'
        working-directory: crates/rootglass-desktop
        env:
          ROOTGLASS_RUNTIME_VERSION: ${{ needs.runtime_assets.outputs.runtime_version }}
        run: |
          cargo build --locked --release
          cargo-packager --release --formats ${{ matrix.format }}

      - name: Write package checksum
        if: runner.os == 'Linux'
        working-directory: crates/rootglass-desktop
        run: sha256sum target/release/*.${{ matrix.extension }} "$RUNNER_TEMP"/rootglass-runtime-linux-x86_64-${{ needs.runtime_assets.outputs.runtime_version }}.tar.gz > target/release/SHA256SUMS-${{ matrix.config }}.txt

      - name: Write package checksum
        if: runner.os == 'macOS'
        working-directory: crates/rootglass-desktop
        run: shasum -a 256 target/release/*.${{ matrix.extension }} "$RUNNER_TEMP"/rootglass-runtime-macos-arm64-${{ needs.runtime_assets.outputs.runtime_version }}.tar.gz > target/release/SHA256SUMS-${{ matrix.config }}.txt

      - name: Write package checksum
        if: runner.os == 'Windows'
        working-directory: crates/rootglass-desktop
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem target/release/*-setup.${{ matrix.extension }})
          if ($installer.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installer.Count)"
          }
          $installer +
          @(Get-Item "$env:RUNNER_TEMP/rootglass-runtime-windows-x86_64-${{ needs.runtime_assets.outputs.runtime_version }}.zip") |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content target/release/SHA256SUMS-${{ matrix.config }}.txt

      - name: Upload unsigned package artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-${{ matrix.format }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            crates/rootglass-desktop/target/release/*.${{ matrix.extension }}
            crates/rootglass-desktop/target/release/SHA256SUMS-${{ matrix.config }}.txt
            ${{ runner.temp }}/rootglass-runtime-*.tar.gz
            ${{ runner.temp }}/rootglass-runtime-*.zip
            ${{ runner.temp }}/rootglass-runtime-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Windows installer instead of raw desktop executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-${{ matrix.format }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            crates/rootglass-desktop/target/release/*-setup.${{ matrix.extension }}
            crates/rootglass-desktop/target/release/SHA256SUMS-${{ matrix.config }}.txt
            ${{ runner.temp }}/rootglass-runtime-*.zip
            ${{ runner.temp }}/rootglass-runtime-*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attach-current-release-assets:
    name: Attach current build artifacts to a draft prerelease
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag && fromJSON(needs.select_platforms.outputs.build_packages) }}
    needs: [select_platforms, package, runtime_assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: rootglass-*
          path: release-artifacts
          merge-multiple: false

      - name: Verify and attach complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/assemble-release-artifacts.sh release-artifacts "$RUNNER_TEMP/release-assets-ready" "$RELEASE_TAG"

  attach-existing-release-assets:
    name: Attach artifacts from an existing package run
    if: ${{ !fromJSON(needs.select_platforms.outputs.build_packages) }}
    needs: [select_platforms]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download package artifacts from the selected run
        uses: actions/download-artifact@v4
        with:
          pattern: rootglass-*
          path: downloaded-artifacts
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify source run and attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "artifact_run_id must be numeric" >&2; exit 1; }
          [[ -n "$RELEASE_TAG" ]] || { echo "release_tag is required with artifact_run_id" >&2; exit 1; }

          run_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" --jq '.status')
          [[ "$run_status" == "completed" ]] || {
            echo "Artifact run $ARTIFACT_RUN_ID must be complete (found $run_status)" >&2
            exit 1
          }
          run_head_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID" --jq '.head_sha')
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          while [[ "$tag_type" == "tag" ]]; do
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
            tag_type=$(jq -r '.object.type' <<< "$tag_object")
            tag_sha=$(jq -r '.object.sha' <<< "$tag_object")
          done
          [[ "$run_head_sha" == "$tag_sha" ]] || {
            echo "Artifact run $ARTIFACT_RUN_ID was not built from release tag $RELEASE_TAG" >&2
            exit 1
          }

          source_jobs_text=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name == "Materialize pinned guest boot assets" or .name == "Linux x64 package" or .name == "macOS arm64 package" or .name == "Windows x64 package") | [.name, .conclusion] | @tsv')
          mapfile -t source_jobs <<< "$source_jobs_text"
          if [[ "${#source_jobs[@]}" -ne 4 ]]; then
            printf 'Expected four completed runtime/package jobs in run %s, found %s\n' "$ARTIFACT_RUN_ID" "${#source_jobs[@]}" >&2
            printf '%s\n' "${source_jobs[@]}" >&2
            exit 1
          fi
          for required_job in \
            'Materialize pinned guest boot assets' \
            'Linux x64 package' \
            'macOS arm64 package' \
            'Windows x64 package'; do
            if ! printf '%s\n' "${source_jobs[@]}" | grep -Fqx "$required_job"$'\t'success; then
              echo "Required package job did not succeed in run $ARTIFACT_RUN_ID: $required_job" >&2
              printf '%s\n' "${source_jobs[@]}" >&2
              exit 1
            fi
          done

          bash scripts/assemble-release-artifacts.sh downloaded-artifacts "$RUNNER_TEMP/release-assets-ready" "$RELEASE_TAG"
