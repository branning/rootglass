name: Desktop packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - macos
          - windows

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  select-platforms:
    name: Select package platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select platform matrix
        id: select
        env:
          PLATFORM: ${{ github.event_name == 'release' && 'all' || inputs.platform }}
        run: |
          case "$PLATFORM" in
            all|linux|macos|windows) ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          matrix=$(jq -cn --arg platform "$PLATFORM" '
            {include: ([
              {config: "linux", name: "Linux x64", runner: "ubuntu-24.04", format: "deb", extension: "deb"},
              {config: "macos", name: "macOS arm64", runner: "macos-15", format: "dmg", extension: "dmg"},
              {config: "windows", name: "Windows x64", runner: "windows-2025", format: "nsis", extension: "exe"}
            ] | map(select($platform == "all" or .config == $platform)))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }} package
    needs: select-platforms
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rootglass-desktop -> crates/rootglass-desktop/target

      - name: Cache C/C++ compiler outputs (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootglass-ccache
          key: ccache-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/rootglass-desktop/Cargo.lock') }}
          restore-keys: |
            ccache-packages-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache clang g++ gcc dpkg-dev \
            libasound2-dev libfontconfig-dev libssl-dev libvulkan1 \
            libwayland-dev libwebkit2gtk-4.1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev vulkan-validationlayers

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress

      - name: Install Cargo Packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build and package desktop (Linux ccache)
        if: runner.os == 'Linux'
        working-directory: crates/rootglass-desktop
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: ${{ runner.temp }}/rootglass-ccache
          CCACHE_MAXSIZE: 512M
          CCACHE_COMPILERCHECK: content
        run: |
          cargo build --release
          cargo-packager --release --formats ${{ matrix.format }}

      - name: Build and package desktop
        if: runner.os != 'Linux'
        working-directory: crates/rootglass-desktop
        run: |
          cargo build --release
          cargo-packager --release --formats ${{ matrix.format }}

      - name: Write package checksum
        if: runner.os == 'Linux'
        working-directory: crates/rootglass-desktop
        run: sha256sum target/release/*.${{ matrix.extension }} > target/release/SHA256SUMS.txt

      - name: Write package checksum
        if: runner.os == 'macOS'
        working-directory: crates/rootglass-desktop
        run: shasum -a 256 target/release/*.${{ matrix.extension }} > target/release/SHA256SUMS.txt

      - name: Write package checksum
        if: runner.os == 'Windows'
        working-directory: crates/rootglass-desktop
        shell: pwsh
        run: |
          Get-FileHash target/release/*.${{ matrix.extension }} -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content target/release/SHA256SUMS.txt

      - name: Upload unsigned package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootglass-${{ matrix.format }}-${{ runner.os }}-${{ runner.arch }}
          path: |
            crates/rootglass-desktop/target/release/*.${{ matrix.extension }}
            crates/rootglass-desktop/target/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
