name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/rootglass-desktop/Cargo.toml --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace --all-targets

  desktop-linux:
    name: Desktop compile (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rootglass-desktop -> target

      - name: Cache C/C++ compiler outputs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/rootglass-ccache
          key: ccache-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/rootglass-desktop/Cargo.lock') }}
          restore-keys: |
            ccache-desktop-${{ runner.os }}-${{ runner.arch }}-

      - name: Install GPUI Kit system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache clang g++ gcc \
            libasound2-dev libfontconfig-dev libssl-dev libvulkan1 \
            libwayland-dev libwebkit2gtk-4.1-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev vulkan-validationlayers

      - name: Check desktop application
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: ${{ runner.temp }}/rootglass-ccache
          CCACHE_MAXSIZE: 512M
          CCACHE_COMPILERCHECK: content
        run: cargo check --manifest-path crates/rootglass-desktop/Cargo.toml

  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Smoke test CLI validate
        run: cargo run --locked --manifest-path crates/rootglass-desktop/Cargo.toml --no-default-features -- validate examples/hello-world.glass

      - name: Smoke test CLI plan
        run: cargo run --locked --manifest-path crates/rootglass-desktop/Cargo.toml --no-default-features -- plan examples/hello-world.glass

      - name: Smoke test TUI terminal lifecycle
        run: cargo test --locked --manifest-path crates/rootglass-desktop/Cargo.toml --no-default-features --test tui_terminal

  boot-smoke:
    name: Boot smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 hosted
            runner: ubuntu-latest
            expected_accel: ""
          - name: arm64 hosted
            runner: ubuntu-24.04-arm
            expected_accel: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Prepare host tools
        run: |
          sudo apt update
          sudo apt install -y qemu-system-arm e2fsprogs cpio squashfs-tools python3

      - name: Report KVM availability
        run: |
          uname -m
          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available on this hosted runner"
          fi

      - name: Run boot smoke
        env:
          EXPECT_QEMU_ACCEL: ${{ matrix.expected_accel }}
        run: bash scripts/smoke-boot-example.sh

      - name: Upload boot smoke transcript on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-log-${{ matrix.name }}
          path: .rootglass/build/hello-world-boot.log
          if-no-files-found: warn
          retention-days: 7
