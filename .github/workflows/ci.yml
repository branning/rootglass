name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace --all-targets

  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Smoke test CLI validate
        run: cargo run --locked -p rootglass-cli -- validate examples/hello-world.glass

      - name: Smoke test CLI plan
        run: cargo run --locked -p rootglass-cli -- plan examples/hello-world.glass

  boot-smoke:
    name: Boot smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64 TCG
            runner: ubuntu-latest
            expected_accel: ""
          - name: arm64 KVM
            runner: ubuntu-24.04-arm
            expected_accel: kvm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache Cargo registry and build outputs
        uses: Swatinem/rust-cache@v2

      - name: Prepare host tools
        run: |
          sudo apt update
          sudo apt install -y qemu-system-arm e2fsprogs

      - name: Run boot smoke
        env:
          EXPECT_QEMU_ACCEL: ${{ matrix.expected_accel }}
        run: bash scripts/smoke-boot-example.sh
