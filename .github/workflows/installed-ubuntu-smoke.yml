name: Installed Ubuntu clean-install smoke

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful Linux x64 package run for this commit, or an ancestor changed only in this workflow
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: installed-ubuntu-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-smoke:
    name: Install and exercise Linux x64 package offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the package source revision
        uses: actions/checkout@v6

      - name: Validate matching Linux package run
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "package_run_id must be numeric" >&2
            exit 1
          }
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID")
          [[ "$(jq -r '.path' <<< "$run_json")" == ".github/workflows/desktop-packages.yml" ]] || {
            echo "Run $PACKAGE_RUN_ID is not the Desktop packages workflow" >&2
            exit 1
          }
          [[ "$(jq -r '.status' <<< "$run_json")" == "completed" && \
             "$(jq -r '.conclusion' <<< "$run_json")" == "success" ]] || {
            echo "Package run $PACKAGE_RUN_ID must have completed successfully" >&2
            exit 1
          }
          package_sha=$(jq -r '.head_sha' <<< "$run_json")
          if [[ "$package_sha" != "$GITHUB_SHA" ]]; then
            comparison=$(gh api "repos/$GITHUB_REPOSITORY/compare/$package_sha...$GITHUB_SHA")
            [[ "$(jq -r '.status' <<< "$comparison")" == ahead && \
               "$(jq -r '.merge_base_commit.sha' <<< "$comparison")" == "$package_sha" ]] || {
              echo "Package run $PACKAGE_RUN_ID is not an ancestor of $GITHUB_SHA" >&2
              exit 1
            }
            changed_files=$(jq -r '[.files[].filename] | unique | join("\n")' <<< "$comparison")
            [[ "$changed_files" == ".github/workflows/installed-ubuntu-smoke.yml" ]] || {
              echo "Package source $package_sha differs outside the installed Ubuntu smoke workflow" >&2
              printf '%s\n' "$changed_files" >&2
              exit 1
            }
            echo "Package source $package_sha matches current product code; only the smoke workflow changed"
          fi
          jobs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID/jobs?per_page=100")
          for required_job in "Materialize pinned guest boot assets" "Linux x64 package"; do
            conclusion=$(jq -r --arg name "$required_job" \
              '[.jobs[] | select(.name == $name) | .conclusion] | first // "missing"' \
              <<< "$jobs_json")
            [[ "$conclusion" == "success" ]] || {
              echo "Required package job '$required_job' did not succeed (found $conclusion)" >&2
              exit 1
            }
          done
          echo "Validated Linux x64 package run $PACKAGE_RUN_ID at $GITHUB_SHA"

      - name: Download Linux package artifact
        uses: actions/download-artifact@v4
        with:
          name: rootglass-deb-Linux-X64
          path: ${{ runner.temp }}/rootglass-package
          repository: ${{ github.repository }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}

      - name: Download signed example artifact
        uses: actions/download-artifact@v4
        with:
          name: rootglass-example-glass
          path: ${{ runner.temp }}/rootglass-example
          repository: ${{ github.repository }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}

      - name: Install GUI and smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 desktop-file-utils e2fsprogs imagemagick iptables \
            python3 python3-xlib x11-utils xauth xdg-desktop-portal \
            xdg-desktop-portal-gtk xdg-utils xdotool xvfb

      - name: Verify artifact checksums and package metadata
        timeout-minutes: 4
        env:
          PACKAGE_DIR: ${{ runner.temp }}/rootglass-package
          EXAMPLE_DIR: ${{ runner.temp }}/rootglass-example
          TEST_HOME: ${{ runner.temp }}/rootglass-user-home
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-install-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$TEST_HOME/.config/rootglass" "$TEST_HOME/.local/share"
          progress_file="$EVIDENCE_DIR/progress.txt"
          progress() {
            printf '%s\n' "$1" | tee -a "$progress_file"
          }
          cat > "$TEST_HOME/.config/rootglass/trust.json" <<'JSON'
          {
            "schemaVersion": 1,
            "trustedPublishers": [
              {
                "name": "Rootglass Examples",
                "identity": "rootglass.dev/examples",
                "keyId": "ed25519:4a079f6f512c9e1a24f83b08e84fb8508996c91e0d54a19512fabfafc82b62d0",
                "publicKeyBase64url": "2To2Sg0jWnaNlkRA4GCUa3qbqmZkaw5IMCHh0vRnRpw"
              }
            ],
            "revokedKeyIds": []
          }
          JSON
          chmod 600 "$TEST_HOME/.config/rootglass/trust.json"

          if timeout --signal=TERM --kill-after=5s 120s \
            python3 - "$PACKAGE_DIR" "$EXAMPLE_DIR" > "$EVIDENCE_DIR/checksums.log" 2>&1 <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def verify(checksum_file: Path, root: Path) -> None:
              for line in checksum_file.read_text(encoding="ascii").splitlines():
                  if not line.strip():
                      continue
                  expected, filename = line.split(maxsplit=1)
                  name = Path(filename.lstrip(" *")).name
                  matches = list(root.rglob(name))
                  if len(matches) != 1:
                      raise SystemExit(f"expected one artifact named {name}, found {len(matches)}")
                  actual = sha256_file(matches[0])
                  if actual.lower() != expected.lower():
                      raise SystemExit(f"SHA-256 mismatch for {matches[0]}")
                  print(f"verified {name}: {actual}")

          package_dir, example_dir = map(Path, sys.argv[1:])
          print("verifying downloaded package and example checksums", flush=True)
          package_checks = list(package_dir.rglob("SHA256SUMS-linux.txt"))
          example_checks = list(example_dir.rglob("SHA256SUMS-example.txt"))
          debs = list(package_dir.rglob("*.deb"))
          glasses = list(example_dir.rglob("*.glass"))
          if len(package_checks) != 1 or len(example_checks) != 1:
              raise SystemExit("expected one package and one example checksum file")
          if len(debs) != 1 or len(glasses) != 1:
              raise SystemExit("expected one Linux .deb and one signed .glass artifact")
          verify(package_checks[0], package_dir)
          verify(example_checks[0], example_dir)
          (package_dir / "package-path.txt").write_text(str(debs[0]) + "\n", encoding="utf-8")
          (example_dir / "glass-path.txt").write_text(str(glasses[0]) + "\n", encoding="utf-8")
          PY
          then
            cat "$EVIDENCE_DIR/checksums.log"
          else
            checksum_status=$?
            cat "$EVIDENCE_DIR/checksums.log"
            exit "$checksum_status"
          fi
          progress "checksums verified"

          deb=$(cat "$PACKAGE_DIR/package-path.txt")
          package_name=$(dpkg-deb -f "$deb" Package)
          package_depends=$(dpkg-deb -f "$deb" Depends)
          {
            echo "Package: $package_name"
            dpkg-deb -f "$deb" Package Version Architecture
            echo "Depends: $package_depends"
          } | tee "$EVIDENCE_DIR/package.txt"
          for dependency in libxcb1 libxkbcommon0 libxkbcommon-x11-0; do
            if [[ "$package_depends" != *"$dependency"* ]]; then
              echo "Debian package is missing runtime dependency: $dependency" >&2
              exit 1
            fi
          done
          printf '%s\n' "$package_name" > "$EVIDENCE_DIR/package-name.txt"
          progress "package checksums and metadata verified"

      - name: Install package and record host
        timeout-minutes: 5
        env:
          PACKAGE_DIR: ${{ runner.temp }}/rootglass-package
          TEST_HOME: ${{ runner.temp }}/rootglass-user-home
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-install-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$TEST_HOME/.config/rootglass" "$TEST_HOME/.local/share"
          deb=$(cat "$PACKAGE_DIR/package-path.txt")
          package_name=$(cat "$EVIDENCE_DIR/package-name.txt")
          progress() {
            printf '%s\n' "$1" | tee -a "$EVIDENCE_DIR/progress.txt"
          }
          progress "installing Linux package with a 180-second limit"
          if sudo timeout --signal=TERM --kill-after=10s 180s \
            env DEBIAN_FRONTEND=noninteractive apt-get install -y "$deb" \
            > "$EVIDENCE_DIR/package-install.log" 2>&1; then
            cat "$EVIDENCE_DIR/package-install.log"
          else
            install_status=$?
            cat "$EVIDENCE_DIR/package-install.log"
            exit "$install_status"
          fi
          progress "Linux package installed"
          rootglass_binary="$(command -v rootglass)"
          [[ -x "$rootglass_binary" ]] || { echo "Installed rootglass binary is missing" >&2; exit 1; }
          echo "$rootglass_binary" > "$EVIDENCE_DIR/binary-path.txt"
          dpkg-query -L "$package_name" > "$EVIDENCE_DIR/installed-files.txt"
          uname -a | tee "$EVIDENCE_DIR/host.txt"
          if [[ -e /dev/kvm ]]; then
            ls -l /dev/kvm | tee -a "$EVIDENCE_DIR/host.txt"
          else
            echo "/dev/kvm is unavailable; TCG will be used" | tee -a "$EVIDENCE_DIR/host.txt"
          fi
          progress "host and installed package recorded"

      - name: Verify installed runtime inventory
        timeout-minutes: 4
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-install-evidence
        run: |
          set -euo pipefail
          progress() {
            printf '%s\n' "$1" | tee -a "$EVIDENCE_DIR/progress.txt"
          }
          runtime_info=$(awk '/\/runtime-info\.json$/ { print; exit }' "$EVIDENCE_DIR/installed-files.txt")
          [[ -n "$runtime_info" && -f "$runtime_info" ]] || {
            echo "The installed package has no runtime inventory" >&2
            exit 1
          }
          runtime_root="$(dirname "$runtime_info")"
          progress "verifying installed runtime inventory with a 120-second limit"
          if timeout --signal=TERM --kill-after=5s 120s \
            python3 - "$runtime_root" > "$EVIDENCE_DIR/runtime-inventory.txt" 2>&1 <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          info = json.loads((root / "runtime-info.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "assets.json").read_text(encoding="utf-8"))
          if info["target_platform"] != "linux-x86_64":
              raise SystemExit(f"unexpected runtime platform: {info['target_platform']}")
          for asset in manifest["assets"]:
              path = root / asset["path"]
              if not path.is_file():
                  raise SystemExit(f"missing runtime asset: {path}")
          rom = root / "share" / "qemu" / "efi-virtio.rom"
          if not rom.is_file():
              raise SystemExit(f"missing bundled QEMU EFI virtio ROM: {rom}")
          qemu_assets = [asset for asset in manifest["assets"] if asset["kind"] == "qemu"]
          if len(qemu_assets) != 1:
              raise SystemExit(f"expected one bundled QEMU binary, found {len(qemu_assets)}")
          qemu_asset = qemu_assets[0]
          qemu = root / qemu_asset["path"]
          if qemu_asset["sha256"].lower() != info["qemu_sha256"].lower():
              raise SystemExit("QEMU digest in runtime metadata does not match the asset manifest")
          print(f"runtime_version={info['runtime_version']}")
          print(f"target_platform={info['target_platform']}")
          print(f"qemu_version={info['qemu_version']}")
          print(f"qemu_source={info['qemu_source']}")
          print(f"qemu_sha256={info['qemu_sha256']}")
          print(f"qemu_binary={qemu}")
          print(f"efi_virtio_rom={rom}")
          print(f"installed_asset_count={len(manifest['assets'])}")
          PY
          then
            cat "$EVIDENCE_DIR/runtime-inventory.txt"
          else
            inventory_status=$?
            cat "$EVIDENCE_DIR/runtime-inventory.txt"
            exit "$inventory_status"
          fi
          progress "installed runtime inventory verified"

      - name: Run installed OS association smoke offline
        timeout-minutes: 6
        env:
          EXAMPLE_DIR: ${{ runner.temp }}/rootglass-example
          TEST_HOME: ${{ runner.temp }}/rootglass-user-home
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-install-evidence
        run: |
          set -euo pipefail
          progress() {
            printf '%s\n' "$1" | tee -a "$EVIDENCE_DIR/progress.txt"
          }
          rootglass_binary=$(cat "$EVIDENCE_DIR/binary-path.txt")
          glass=$(cat "$EXAMPLE_DIR/glass-path.txt")
          shim_path="$RUNNER_TEMP/rootglass-shims:$PATH"
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT 1 ! -o lo -j REJECT >/dev/null 2>&1 || true' EXIT
          association_log="$EVIDENCE_DIR/association-smoke.log"
          progress "running offline .glass association check"
          if timeout --signal=TERM --kill-after=15s 300s \
            dbus-run-session -- xvfb-run --auto-servernum \
              --server-args='-screen 0 1920x1200x24' \
              env PATH="$shim_path" HOME="$TEST_HOME" \
              bash scripts/smoke-rootglass-installed-linux-association.sh \
                "$rootglass_binary" "$glass" "$EVIDENCE_DIR/association" \
            > "$association_log" 2>&1; then
            cat "$association_log"
          else
            association_status=$?
            cat "$association_log"
            exit "$association_status"
          fi
          progress "installed .glass association verified"

      - name: Run installed GPUI desktop guest workflow offline
        timeout-minutes: 12
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-install-evidence
        run: |
          set -euo pipefail
          progress() {
            printf '%s\n' "$1" | tee -a "$EVIDENCE_DIR/progress.txt"
          }
          rootglass_binary=$(cat "$EVIDENCE_DIR/binary-path.txt")
          shim_path="$RUNNER_TEMP/rootglass-shims:$PATH"
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT 1 ! -o lo -j REJECT >/dev/null 2>&1 || true' EXIT
          gui_log="$EVIDENCE_DIR/gui-workflow-output.txt"
          progress "running installed GPUI workflow offline"
          if timeout --signal=TERM --kill-after=15s 600s \
            dbus-run-session -- xvfb-run --auto-servernum \
              --server-args='-screen 0 1920x1200x24' \
              env PATH="$shim_path" \
              bash scripts/smoke-rootglass-desktop-xvfb.sh \
                "$rootglass_binary" "$EVIDENCE_DIR/gui-workflow" \
            > "$gui_log" 2>&1; then
            cat "$gui_log"
          else
            gui_status=$?
            cat "$gui_log"
            exit "$gui_status"
          fi
          progress "installed GPUI workflow verified"

      - name: Run installed CLI guest boot offline
        timeout-minutes: 8
        env:
          EXAMPLE_DIR: ${{ runner.temp }}/rootglass-example
          TEST_HOME: ${{ runner.temp }}/rootglass-user-home
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-install-evidence
        run: |
          set -euo pipefail
          progress() {
            printf '%s\n' "$1" | tee -a "$EVIDENCE_DIR/progress.txt"
          }
          rootglass_binary=$(cat "$EVIDENCE_DIR/binary-path.txt")
          shim_path="$RUNNER_TEMP/rootglass-shims:$PATH"
          sudo iptables -I OUTPUT 1 ! -o lo -j REJECT
          trap 'sudo iptables -D OUTPUT 1 ! -o lo -j REJECT >/dev/null 2>&1 || true' EXIT

          work_dir="$RUNNER_TEMP/rootglass-installed-boot"
          mkdir -p "$work_dir"
          mkdir -p "$RUNNER_TEMP/rootglass-qemu-tmp"
          cp -a examples/hello-world.glass "$work_dir/hello-world.glass"
          boot_log="$EVIDENCE_DIR/installed-cli-boot-output.txt"
          progress "running offline installed CLI guest boot"
          if timeout --signal=TERM --kill-after=15s 420s \
            env PATH="$shim_path" \
              HOME="$TEST_HOME" \
              XDG_CONFIG_HOME="$TEST_HOME/.config" \
              TMPDIR="$RUNNER_TEMP/rootglass-qemu-tmp" \
              ROOTGLASS_BINARY="$rootglass_binary" \
              ROOTGLASS_SMOKE_GLASS="$work_dir/hello-world.glass" \
              ROOTGLASS_SMOKE_CWD="$work_dir" \
              ROOTGLASS_SMOKE_LOG="$EVIDENCE_DIR/installed-cli-boot.log" \
              python3 scripts/smoke-boot-example.py \
            > "$boot_log" 2>&1; then
            cat "$boot_log"
          else
            boot_status=$?
            cat "$boot_log"
            exit "$boot_status"
          fi

          if compgen -G "$RUNNER_TEMP/rootglass-shims/*.used" >/dev/null; then
            echo "The installed app attempted to use a developer tool or system QEMU" >&2
            ls -l "$RUNNER_TEMP/rootglass-shims" >&2
            exit 1
          fi
          progress "installed CLI guest boot verified"
          echo "PASS: package installed and guest workflows ran offline outside the checkout"

      - name: Verify uninstall preserves user trust and library data
        if: always()
        env:
          PACKAGE_DIR: ${{ runner.temp }}/rootglass-package
          TEST_HOME: ${{ runner.temp }}/rootglass-user-home
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-install-evidence
        run: |
          set -euo pipefail
          if [[ ! -f "$PACKAGE_DIR/package-path.txt" ]]; then
            echo "Package install did not reach the data-retention check" >> "$EVIDENCE_DIR/uninstall.txt"
            exit 0
          fi
          deb=$(cat "$PACKAGE_DIR/package-path.txt")
          package_name=$(dpkg-deb -f "$deb" Package)
          sudo apt-get remove -y "$package_name"
          command -v rootglass >/dev/null 2>&1 && { echo "rootglass remains on PATH after removal" >&2; exit 1; }
          test -f "$TEST_HOME/.config/rootglass/trust.json"
          test -d "$TEST_HOME/.local/share/rootglass/library"
          find "$TEST_HOME/.local/share/rootglass/library" -type f -print \
            | tee "$EVIDENCE_DIR/uninstall.txt"
          echo "PASS: package removed; per-user trust and imported library remain"

      - name: Upload installed Ubuntu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-ubuntu-clean-install-${{ github.run_id }}
          path: ${{ runner.temp }}/rootglass-install-evidence
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
