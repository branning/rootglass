name: Installed macOS TUI smoke

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful Desktop packages run ID for this commit (macOS only)
        type: string
        required: true

permissions:
  contents: read

jobs:
  boot-example:
    name: Install app and boot example through TUI
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out workflow commit
        uses: actions/checkout@v6

      - name: Validate package run
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "package_run_id must be numeric" >&2
            exit 1
          }

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID")
          [[ "$(jq -r '.path' <<< "$run_json")" == ".github/workflows/desktop-packages.yml" ]] || {
            echo "Run $PACKAGE_RUN_ID is not the Desktop packages workflow" >&2
            exit 1
          }
          [[ "$(jq -r '.status' <<< "$run_json")" == "completed" && \
             "$(jq -r '.conclusion' <<< "$run_json")" == "success" ]] || {
            echo "Package run $PACKAGE_RUN_ID must have completed successfully" >&2
            exit 1
          }
          [[ "$(jq -r '.head_sha' <<< "$run_json")" == "$GITHUB_SHA" ]] || {
            echo "Package run $PACKAGE_RUN_ID was built from a different commit" >&2
            exit 1
          }

          jobs_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID/jobs?per_page=100")
          for required_job in "Materialize pinned guest boot assets" "macOS arm64 package"; do
            conclusion=$(jq -r --arg name "$required_job" \
              '[.jobs[] | select(.name == $name) | .conclusion] | first // "missing"' \
              <<< "$jobs_json")
            [[ "$conclusion" == "success" ]] || {
              echo "Required package job '$required_job' did not succeed in run $PACKAGE_RUN_ID (found $conclusion)" >&2
              exit 1
            }
          done
          echo "Validated successful macOS package artifacts from $PACKAGE_RUN_ID at $GITHUB_SHA"

      - name: Download macOS package artifact
        uses: actions/download-artifact@v4
        with:
          name: rootglass-dmg-macOS-ARM64
          path: ${{ runner.temp }}/rootglass-package
          repository: ${{ github.repository }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}

      - name: Download materialized example artifact
        uses: actions/download-artifact@v4
        with:
          name: rootglass-example-glass
          path: ${{ runner.temp }}/rootglass-example
          repository: ${{ github.repository }}
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}

      - name: Set up Python for the PTY driver
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install terminal capture dependencies
        run: python -m pip install --disable-pip-version-check pyte==0.8.2 Pillow==13.0.0

      - name: Verify sample checksum and install the app
        env:
          PACKAGE_DIR: ${{ runner.temp }}/rootglass-package
          EXAMPLE_DIR: ${{ runner.temp }}/rootglass-example
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-tui-evidence
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          example_checksum=$(find "$EXAMPLE_DIR" -type f -name SHA256SUMS-example.txt -print -quit)
          [[ -n "$example_checksum" ]] || { echo "Example checksum file is missing" >&2; exit 1; }
          (cd "$(dirname "$example_checksum")" && shasum -a 256 --check "$(basename "$example_checksum")")
          example_count=$(find "$EXAMPLE_DIR" -type f -name '*.glass' | wc -l | tr -d ' ')
          [[ "$example_count" == 1 ]] || {
            echo "Expected one .glass sample, found $example_count" >&2
            find "$EXAMPLE_DIR" -maxdepth 3 -type f -print >&2
            exit 1
          }
          dmg=$(find "$PACKAGE_DIR" -type f -name '*.dmg' -print -quit)
          [[ -n "$dmg" ]] || {
            echo "The package run did not contain a macOS DMG" >&2
            find "$PACKAGE_DIR" -maxdepth 4 -type f -print >&2
            exit 1
          }
          package_checksum=$(find "$PACKAGE_DIR" -type f -name SHA256SUMS-macos.txt -print -quit)
          [[ -n "$package_checksum" ]] || { echo "macOS package checksum file is missing" >&2; exit 1; }
          dmg_name=$(basename "$dmg")
          expected_dmg_hash=$(awk -v name="$dmg_name" '
            {
              filename = $0
              sub(/^[0-9a-fA-F]+[[:space:]]+/, "", filename)
              count = split(filename, parts, "/")
              if (parts[count] == name) { print substr($0, 1, 64); exit }
            }
          ' "$package_checksum")
          actual_dmg_hash=$(shasum -a 256 "$dmg" | awk '{print $1}')
          [[ -n "$expected_dmg_hash" && "$expected_dmg_hash" == "$actual_dmg_hash" ]] || {
            echo "DMG checksum mismatch for $dmg_name" >&2
            exit 1
          }

          example_glass=$(find "$EXAMPLE_DIR" -type f -name '*.glass' -print -quit)
          example_hash=$(shasum -a 256 "$example_glass" | awk '{print $1}')

          mountpoint="$RUNNER_TEMP/rootglass-dmg"
          mkdir -p "$mountpoint"
          # The DMG embeds its license agreement. Supply the affirmative
          # response so hdiutil can mount it on a headless runner.
          printf 'y\n' | hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$dmg"
          trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true' EXIT
          [[ -d "$mountpoint/Rootglass.app" ]] || {
            echo "Rootglass.app was not present at the DMG root" >&2
            find "$mountpoint" -maxdepth 3 -print >&2
            exit 1
          }
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mountpoint/Rootglass.app/Contents/Info.plist")
          sudo ditto "$mountpoint/Rootglass.app" /Applications/Rootglass.app
          hdiutil detach "$mountpoint"
          trap - EXIT
          echo "Installed $dmg at /Applications/Rootglass.app"
          mkdir -p "$EVIDENCE_DIR"
          {
            printf 'Package workflow run: %s\n' "$PACKAGE_RUN_ID"
            printf 'Workflow commit: %s\n' "$GITHUB_SHA"
            printf 'OS: %s %s (%s)\n' "$(sw_vers -productName)" \
              "$(sw_vers -productVersion)" "$(sw_vers -buildVersion)"
            printf 'Architecture: %s\n' "$(uname -m)"
            printf 'Application version: %s\n' "$app_version"
            printf 'DMG: %s\nDMG SHA-256: %s\n' "$dmg_name" "$actual_dmg_hash"
            printf 'Example: %s\nExample SHA-256: %s\n' \
              "$(basename "$example_glass")" "$example_hash"
          } | tee "$EVIDENCE_DIR/package-install.txt"

      - name: Configure example publisher trust
        env:
          TEST_HOME: ${{ runner.temp }}/rootglass-home
          TEST_TMPDIR: ${{ runner.temp }}/rootglass-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TEST_HOME/Library/Application Support/Rootglass" "$TEST_TMPDIR"
          cat > "$TEST_HOME/Library/Application Support/Rootglass/trust.json" <<'JSON'
          {
            "schemaVersion": 1,
            "trustedPublishers": [
              {
                "name": "Rootglass Examples",
                "identity": "rootglass.dev/examples",
                "keyId": "ed25519:4a079f6f512c9e1a24f83b08e84fb8508996c91e0d54a19512fabfafc82b62d0",
                "publicKeyBase64url": "2To2Sg0jWnaNlkRA4GCUa3qbqmZkaw5IMCHh0vRnRpw"
              }
            ],
            "revokedKeyIds": []
          }
          JSON
          chmod 600 "$TEST_HOME/Library/Application Support/Rootglass/trust.json"

      - name: Check isolated macOS package-store permissions
        env:
          TEST_HOME: ${{ runner.temp }}/rootglass-home
        run: |
          set -euo pipefail
          app_data_root="$TEST_HOME/Library/Application Support/Rootglass"
          packages_dir="$app_data_root/library/packages"
          printf 'Runner identity: '
          id
          printf 'Runner umask: '
          umask
          ls -ldeO "$TEST_HOME" "$TEST_HOME/Library" \
            "$TEST_HOME/Library/Application Support" "$app_data_root"
          mkdir -p "$packages_dir"
          ls -ldeO "$app_data_root/library" "$packages_dir"
          python3 - "$packages_dir" <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          parent = Path(sys.argv[1])
          stage = parent / f".rootglass-rename-probe-{os.getpid()}"
          published = parent / f".rootglass-rename-probe-{os.getpid()}-published"
          stage.mkdir()
          (stage / "file").write_text("probe", encoding="ascii")
          (stage / "file").chmod(0o444)
          stage.chmod(0o555)
          try:
              os.rename(stage, published)
          except PermissionError:
              print("Read-only staging-root rename was denied; retrying with a writable root")
              stage.chmod(0o755)
              os.rename(stage, published)
          else:
              print("Read-only staging-root rename was allowed on this runner")
          print("Atomic rename probe completed")
          published.chmod(0o755)
          shutil.rmtree(published)
          PY
          rmdir "$packages_dir" "$app_data_root/library"

      - name: Open the signed example through LaunchServices
        env:
          EXAMPLE_DIR: ${{ runner.temp }}/rootglass-example
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-tui-evidence
          TEST_HOME: ${{ runner.temp }}/rootglass-home
          TEST_TMPDIR: ${{ runner.temp }}/rootglass-tmp
        run: |
          set -euo pipefail
          app=/Applications/Rootglass.app
          glass=$(find "$EXAMPLE_DIR" -type f -name '*.glass' -print -quit)
          [[ -n "$glass" ]] || { echo "Signed example is missing" >&2; exit 1; }
          [[ "$(uname -m)" == arm64 ]] || {
            echo "Expected an Apple Silicon runner, found $(uname -m)" >&2
            exit 1
          }
          major_version=$(sw_vers -productVersion | cut -d. -f1)
          [[ "$major_version" -ge 15 ]] || {
            echo "Expected macOS 15 or later, found $(sw_vers -productVersion)" >&2
            exit 1
          }
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          [[ -x "$lsregister" ]] || { echo "LaunchServices registration tool is missing" >&2; exit 1; }
          "$lsregister" -f "$app"

          cat > "$RUNNER_TEMP/rootglass-file-handler.swift" <<'SWIFT'
          import AppKit
          import Foundation
          import Darwin

          if CommandLine.arguments.count == 3 && CommandLine.arguments[1] == "--terminate" {
              let bundleID = CommandLine.arguments[2]
              for _ in 0..<60 {
                  let applications = NSRunningApplication.runningApplications(withBundleIdentifier: bundleID)
                  if applications.isEmpty { exit(0) }
                  for application in applications { _ = application.terminate() }
                  Thread.sleep(forTimeInterval: 0.25)
              }
              fputs("Rootglass did not terminate after LaunchServices smoke\n", stderr)
              exit(1)
          }

          let glass = URL(fileURLWithPath: CommandLine.arguments[1])
          guard let handler = NSWorkspace.shared.urlForApplication(toOpen: glass) else {
              fputs("LaunchServices did not find an application for \(glass.path)\n", stderr)
              exit(1)
          }
          print(handler.standardizedFileURL.path)
          SWIFT
          associated_app=$(swift "$RUNNER_TEMP/rootglass-file-handler.swift" "$glass")
          [[ "$associated_app" == "$app" ]] || {
            echo "LaunchServices selected '$associated_app' for $glass, expected '$app'" >&2
            exit 1
          }

          event_log="$EVIDENCE_DIR/launchservices-events.log"
          old_smoke=$(launchctl getenv ROOTGLASS_DESKTOP_SMOKE || true)
          old_event_log=$(launchctl getenv ROOTGLASS_DESKTOP_SMOKE_EVENT_LOG || true)
          old_home=$(launchctl getenv HOME || true)
          old_tmpdir=$(launchctl getenv TMPDIR || true)
          restore_launch_environment() {
            if [[ -n "$old_smoke" ]]; then
              launchctl setenv ROOTGLASS_DESKTOP_SMOKE "$old_smoke"
            else
              launchctl unsetenv ROOTGLASS_DESKTOP_SMOKE || true
            fi
            if [[ -n "$old_event_log" ]]; then
              launchctl setenv ROOTGLASS_DESKTOP_SMOKE_EVENT_LOG "$old_event_log"
            else
              launchctl unsetenv ROOTGLASS_DESKTOP_SMOKE_EVENT_LOG || true
            fi
            if [[ -n "$old_home" ]]; then
              launchctl setenv HOME "$old_home"
            else
              launchctl unsetenv HOME || true
            fi
            if [[ -n "$old_tmpdir" ]]; then
              launchctl setenv TMPDIR "$old_tmpdir"
            else
              launchctl unsetenv TMPDIR || true
            fi
          }
          trap restore_launch_environment EXIT
          launchctl setenv ROOTGLASS_DESKTOP_SMOKE 1
          launchctl setenv ROOTGLASS_DESKTOP_SMOKE_EVENT_LOG "$event_log"
          launchctl setenv HOME "$TEST_HOME"
          launchctl setenv TMPDIR "$TEST_TMPDIR"
          open "$glass"

          for _ in $(seq 1 120); do
            if [[ -f "$event_log" ]] && grep -q '^ROOTGLASS_DESKTOP_OPEN_PATH_ACCEPTED$' "$event_log"; then
              break
            fi
            sleep 0.25
          done
          grep -q '^ROOTGLASS_DESKTOP_OPEN_PATH_ACCEPTED$' "$event_log" || {
            echo "LaunchServices did not deliver the .glass path to Rootglass" >&2
            cat "$event_log" 2>/dev/null || true
            exit 1
          }
          for _ in $(seq 1 120); do
            if grep -q '^ROOTGLASS_DESKTOP_OPEN_PATH_ARCHIVE$' "$event_log"; then
              break
            fi
            sleep 0.25
          done
          grep -q '^ROOTGLASS_DESKTOP_OPEN_PATH_ARCHIVE$' "$event_log" || {
            echo "Rootglass did not classify the associated path as a .glass archive" >&2
            cat "$event_log" >&2
            exit 1
          }
          for _ in $(seq 1 120); do
            if grep -q '^ROOTGLASS_DESKTOP_STATE_READY$' "$event_log"; then
              break
            fi
            sleep 0.25
          done
          grep -q '^ROOTGLASS_DESKTOP_STATE_READY$' "$event_log" || {
            echo "Rootglass did not finish verifying and importing the associated .glass archive" >&2
            cat "$event_log" >&2
            exit 1
          }
          printf 'OS: %s %s\nArchitecture: %s\nAssociated app: %s\nOpened bundle: %s\n' \
            "$(sw_vers -productName)" "$(sw_vers -productVersion)" \
            "$(uname -m)" "$associated_app" "$glass" \
            > "$EVIDENCE_DIR/launchservices-open.txt"
          printf 'Isolated home: %s\n' "$TEST_HOME" >> "$EVIDENCE_DIR/launchservices-open.txt"
          cat "$EVIDENCE_DIR/launchservices-open.txt"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          swift "$RUNNER_TEMP/rootglass-file-handler.swift" --terminate "$bundle_id"
          qemu=$(find "$app/Contents/Resources/rootglass/runtime-assets" \
            -type f -name qemu-system-aarch64 -print -quit)
          if [[ -n "$qemu" ]] && pgrep -f "$qemu" >/dev/null; then
            echo "QEMU started during file-open smoke before Boot was requested" >&2
            ps -axo pid=,comm= >&2
            exit 1
          fi

      - name: Verify installed QEMU signature and boot through the TUI
        env:
          EXAMPLE_DIR: ${{ runner.temp }}/rootglass-example
          TEST_HOME: ${{ runner.temp }}/rootglass-home
          TEST_TMPDIR: ${{ runner.temp }}/rootglass-tmp
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-tui-evidence
          SHIM_DIR: ${{ runner.temp }}/rootglass-host-tool-shims
        run: |
          set -euo pipefail
          runtime_root=/Applications/Rootglass.app/Contents/Resources/rootglass/runtime-assets
          qemu=$(find "$runtime_root" \
            -type f -name qemu-system-aarch64 -print -quit)
          [[ -n "$qemu" ]] || { echo "Bundled QEMU is missing" >&2; exit 1; }
          codesign --verify --strict --verbose=2 "$qemu"
          while IFS= read -r library; do
            codesign --verify --strict --verbose=2 "$library"
          done < <(find "$runtime_root" -type f \( -name '*.dylib' -o -name '*.so' \) -print)
          "$qemu" --version

          runtime_root=$(find "$runtime_root" -mindepth 1 -maxdepth 1 -type d -print -quit)
          [[ -n "$runtime_root" ]] || { echo "Versioned runtime directory is missing" >&2; exit 1; }
          cp "$runtime_root/assets.json" "$EVIDENCE_DIR/runtime-assets.json"
          cp "$runtime_root/runtime-info.json" "$EVIDENCE_DIR/runtime-info.json"
          python3 - "$runtime_root" "$EVIDENCE_DIR/runtime-inventory.txt" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          inventory_path = Path(sys.argv[2])
          manifest = json.loads((root / "assets.json").read_text(encoding="utf-8"))
          info = json.loads((root / "runtime-info.json").read_text(encoding="utf-8"))
          assert manifest["runtime_version"] == root.name
          assert info["runtime_version"] == root.name
          assert info["target_platform"] == "macos-arm64"
          assets = manifest["assets"]
          kinds = {asset["kind"] for asset in assets}
          assert {"kernel", "initramfs", "qemu", "support"}.issubset(kinds)
          lines = [f"Runtime version: {root.name}", f"QEMU: {info['qemu_version']}"]
          for asset in assets:
              path = (root / asset["path"]).resolve()
              if root not in path.parents or not path.is_file():
                  raise SystemExit(f"invalid or missing runtime asset: {asset['path']}")
              hasher = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      hasher.update(chunk)
              digest = hasher.hexdigest()
              if digest != asset["sha256"]:
                  raise SystemExit(f"runtime asset checksum mismatch: {asset['path']}")
              lines.append(f"{asset['kind']}: {asset['path']} sha256={digest}")
          if not info["license_files"]:
              raise SystemExit("runtime inventory contains no QEMU license files")
          for name in info["license_files"]:
              if not (root / name).is_file():
                  raise SystemExit(f"runtime license file is missing: {name}")
          lines.append(f"License files: {len(info['license_files'])}")
          inventory_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(inventory_path.read_text(encoding="utf-8"), end="")
          PY

          glass=$(find "$EXAMPLE_DIR" -type f -name '*.glass' -print -quit)
          mkdir -p "$SHIM_DIR"
          for tool in cargo rustc qemu-system-aarch64 qemu-system-x86_64; do
            cat > "$SHIM_DIR/$tool" <<'SHIM'
          #!/bin/sh
          printf '%s %s\n' "$(basename "$0")" "$*" >> "$EVIDENCE_DIR/blocked-host-tool-invocations.log"
          echo "Rootglass attempted to use a host tool instead of the installed package: $0" >&2
          exit 97
          SHIM
            chmod +x "$SHIM_DIR/$tool"
          done
          export PATH="$SHIM_DIR:$PATH"
          network_interface=$(route -n get default | awk '/interface:/{print $2; exit}')
          [[ -n "$network_interface" ]] || { echo "Default network interface was not found" >&2; exit 1; }
          printf 'Offline interface: %s\n' "$network_interface" | tee "$EVIDENCE_DIR/offline-boot.txt"
          sudo -n ifconfig "$network_interface" down
          restore_network() { sudo -n ifconfig "$network_interface" up || true; }
          trap restore_network EXIT
          cd "$RUNNER_TEMP"
          HOME="$TEST_HOME" TMPDIR="$TEST_TMPDIR" \
            python3 "$GITHUB_WORKSPACE/scripts/smoke-rootglass-installed-macos-tui.py" \
              /Applications/Rootglass.app/Contents/MacOS/rootglass \
              "$glass" "$EVIDENCE_DIR"
          sudo -n ifconfig "$network_interface" up
          trap - EXIT
          test -s "$EVIDENCE_DIR/tui-terminal-screenshot.png"
          test ! -s "$EVIDENCE_DIR/blocked-host-tool-invocations.log"
          printf 'Working directory: %s\n' "$RUNNER_TEMP" >> "$EVIDENCE_DIR/offline-boot.txt"
          printf 'Host-tool shims: cargo, rustc, qemu-system-aarch64, qemu-system-x86_64 (no invocation)\n' \
            >> "$EVIDENCE_DIR/offline-boot.txt"

      - name: Remove app and verify user state retention
        env:
          TEST_HOME: ${{ runner.temp }}/rootglass-home
          EVIDENCE_DIR: ${{ runner.temp }}/rootglass-tui-evidence
        run: |
          set -euo pipefail
          app_data_root="$TEST_HOME/Library/Application Support/Rootglass"
          library_root="$app_data_root/library"
          state_root="$app_data_root/states"
          trust_file="$app_data_root/trust.json"
          registry="$library_root/registry.json"
          [[ -s "$trust_file" ]] || { echo "Trust policy was not retained" >&2; exit 1; }
          [[ -s "$registry" ]] || { echo "Imported package registry is missing" >&2; exit 1; }
          trust_hash_before=$(shasum -a 256 "$trust_file" | awk '{print $1}')
          write_user_data_snapshot() {
            python3 - "$library_root" "$state_root" "$1" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          library = Path(sys.argv[1])
          states = Path(sys.argv[2])
          snapshot = Path(sys.argv[3])
          registry = library / "registry.json"
          data = json.loads(registry.read_text(encoding="utf-8"))
          packages = data.get("packages", [])
          if data.get("schema_version") != 1 or not packages:
              raise SystemExit("installed package registry has no retained sample")
          for package in packages:
              path = Path(package["package_path"])
              if not path.is_dir():
                  raise SystemExit(f"installed package data is missing: {path}")
              if not (path / "rootglass.toml").is_file():
                  raise SystemExit(f"installed package manifest is missing: {path}")
          state_files = sorted(path for path in states.rglob("*") if path.is_file())
          if not state_files:
              raise SystemExit("guest state was not persisted under the user data directory")
          lines = [f"packages={len(packages)}"]
          for root in (library, states):
              if not root.is_dir():
                  raise SystemExit(f"user data directory is missing: {root}")
              files = sorted(path for path in root.rglob("*") if path.is_file())
              if not files:
                  raise SystemExit(f"user data directory is empty: {root}")
              lines.append(f"directory={root.name} files={len(files)}")
              for path in files:
                  digest = hashlib.sha256()
                  with path.open("rb") as source:
                      for chunk in iter(lambda: source.read(1024 * 1024), b""):
                          digest.update(chunk)
                  lines.append(
                      f"{root.name}/{path.relative_to(root)} size={path.stat().st_size} "
                      f"sha256={digest.hexdigest()}"
                  )
          snapshot.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(snapshot.read_text(encoding="utf-8"), end="")
          PY
          }
          write_user_data_snapshot "$EVIDENCE_DIR/user-data-before-uninstall.txt"
          registry_hash_before=$(shasum -a 256 "$registry" | awk '{print $1}')
          sudo -n rm -rf /Applications/Rootglass.app
          [[ ! -e /Applications/Rootglass.app ]] || {
            echo "Rootglass.app remained installed" >&2
            exit 1
          }
          [[ -s "$trust_file" && -s "$registry" ]] || {
            echo "Removing Rootglass.app removed user state" >&2
            exit 1
          }
          trust_hash_after=$(shasum -a 256 "$trust_file" | awk '{print $1}')
          registry_hash_after=$(shasum -a 256 "$registry" | awk '{print $1}')
          [[ "$trust_hash_before" == "$trust_hash_after" ]] || {
            echo "Trust policy changed while uninstalling the app" >&2
            exit 1
          }
          [[ "$registry_hash_before" == "$registry_hash_after" ]] || {
            echo "Library registry changed while uninstalling the app" >&2
            exit 1
          }
          write_user_data_snapshot "$RUNNER_TEMP/user-data-after-uninstall.txt"
          diff -u "$EVIDENCE_DIR/user-data-before-uninstall.txt" \
            "$RUNNER_TEMP/user-data-after-uninstall.txt"
          cp "$RUNNER_TEMP/user-data-after-uninstall.txt" "$EVIDENCE_DIR/user-data-after-uninstall.txt"
          printf 'Removed app: /Applications/Rootglass.app\nTrust SHA-256 before/after: %s\nLibrary registry SHA-256 before/after: %s\nLibrary and guest state files: unchanged\n' \
            "$trust_hash_after" "$registry_hash_after" \
            | tee "$EVIDENCE_DIR/uninstall-retention.txt"
          printf 'Library: %s\nGuest state: %s\n' "$library_root" "$state_root" \
            >> "$EVIDENCE_DIR/uninstall-retention.txt"

      - name: Upload TUI, serial, and QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-macos-tui-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/rootglass-tui-evidence
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
