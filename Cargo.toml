[workspace]
members = [
    "crates/rootglass-cli",
    "crates/rootglass-core",
    "crates/rootglass-manifest",
    "crates/rootglass-qemu",
    "crates/rootglass-signature",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/branning/rootglass"

[workspace.dependencies]
rootglass-manifest = { path = "crates/rootglass-manifest" }
rootglass-core = { path = "crates/rootglass-core" }
rootglass-qemu = { path = "crates/rootglass-qemu" }
rootglass-signature = { path = "crates/rootglass-signature" }
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
