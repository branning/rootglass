[workspace]
members = [
    "crates/rootglass-cli",
    "crates/rootglass-core",
    "crates/rootglass-manifest",
    "crates/rootglass-qemu",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/branning/rootglass"

[workspace.dependencies]
rootglass-manifest = { path = "crates/rootglass-manifest" }
rootglass-core = { path = "crates/rootglass-core" }
rootglass-qemu = { path = "crates/rootglass-qemu" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
