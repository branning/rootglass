[workspace]
members = [
    "crates/rootglass-app",
    "crates/rootglass-cli",
    "crates/rootglass-core",
    "crates/rootglass-manifest",
    "crates/rootglass-qemu",
    "crates/rootglass-signature",
    "crates/rootglass-tui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/branning/rootglass"

[workspace.dependencies]
rootglass-app = { path = "crates/rootglass-app" }
rootglass-manifest = { path = "crates/rootglass-manifest" }
rootglass-core = { path = "crates/rootglass-core" }
rootglass-qemu = { path = "crates/rootglass-qemu" }
rootglass-signature = { path = "crates/rootglass-signature" }
rootglass-tui = { path = "crates/rootglass-tui" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", default-features = false, features = ["events"] }
libc = "0.2"
getrandom = "0.4"
base64 = "0.22"
age = { version = "0.11.2", default-features = false }
ed25519-dalek = "2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
